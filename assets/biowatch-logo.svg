<svg width="1024" height="1024" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BIOWATCH-AI logo">
  <defs>
    <linearGradient id="g-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb7a7"/>
      <stop offset="1" stop-color="#2ea89a"/>
    </linearGradient>
    <linearGradient id="g-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45c9b8"/>
      <stop offset="0.5" stop-color="#8b7ad6"/>
      <stop offset="1" stop-color="#45c9b8"/>
    </linearGradient>
    <clipPath id="shape-clip"><path d="M24 2.6 41.5 12.8v20.4L24 43.4 6.5 33.2V12.8Z"/></clipPath>
  </defs>

  <!-- shield outer -->
  <path d="M24 2.6 41.5 12.8v20.4L24 43.4 6.5 33.2V12.8Z"
        fill="#0b1117" stroke="#45c9b8" stroke-width="1.4" stroke-linejoin="round" opacity=".95"/>
  <!-- subtle inner hexagon -->
  <path d="M24 7.6 37.2 15.3v15.4L24 38.4 10.8 30.7V15.3Z"
        fill="none" stroke="#45c9b8" stroke-width=".6" stroke-linejoin="round" opacity=".28"/>

  <!-- two DNA helixes -->
  <path d="M17 13c6 4 6 7.5 0 11.5S11 32 17 36" fill="none" stroke="#8b7ad6" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M31 13c-6 4-6 7.5 0 11.5s6 7.5 0 11.5" fill="none" stroke="#8b7ad6" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>

  <!-- rungs -->
  <g stroke="#2ea89a" stroke-width="1" stroke-linecap="round" opacity=".5">
    <path d="M18.6 16.2h10.8"/>
    <path d="M20.4 24.5h7.2"/>
    <path d="M18.6 32.8h10.8"/>
  </g>

  <!-- signal pulse line -->
  <path d="M11 27.5h5.5l2.4-3.1 2.6 6.4 2.5-9.6 2.6 6.6 2-2.4H37" fill="none" stroke="#45c9b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- core watch point -->
  <circle cx="24" cy="21.2" r="2.5" fill="none" stroke="#45c9b8" stroke-width="1" opacity=".9"/>
  <circle cx="24" cy="21.2" r="1" fill="#45c9b8"/>
</svg>
