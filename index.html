const METRICS=[
 ["Sensitivity / Recall","TP / (TP + FN)","Share of reference events the detector flags. The headline number in surveillance — but meaningless without the alarm rate.","Trivially maximised by flagging everything."],
 ["Specificity","TN / (TN + FP)","Share of non-event weeks correctly left unflagged.","Looks excellent under class imbalance even for a useless detector."],
 ["Precision / PPV","TP / (TP + FP)","Probability that a raised signal is a reference event. This is what an analyst actually experiences.","Depends on prevalence; not transferable between settings."],
 ["F1 score","2·PPV·Sens / (PPV + Sens)","Single summary when precision and recall matter equally.","Hides which of the two is failing; rarely the right operational trade-off."],
 ["AUROC","∫ TPR d(FPR)","Threshold-free ranking quality.","Over-optimistic under heavy imbalance; AUPRC is usually more informative here."],
 ["AUPRC","∫ Precision d(Recall)","Preferred summary when events are rare.","Baseline value equals event prevalence — must always be reported alongside."],
 ["False-positive rate","FP / (FP + TN)","Drives analyst workload directly.","Must be expressed as alarms per unit time to be operationally meaningful."],
 ["False-negative rate","FN / (TP + FN)","Missed events — the failure the system exists to prevent.","Under-estimated when the reference set itself missed events."],
 ["Detection delay","median(t_flag − t_onset)","Weeks between reference onset and first flag. A primary endpoint for early warning.","Onset definition dominates the result."],
 ["Lead time","t_official − t_flag","Weeks gained versus the official/reference declaration.","Negative lead time is common and must be reported honestly."],
 ["Calibration","Brier score, reliability curve, ECE","Whether stated probabilities match observed frequencies.","A well-ranked model can be badly calibrated and therefore unusable for thresholding."],
 ["Confusion matrix","[TP FP; FN TN]","The raw counts every other metric is derived from. Always report it.","Threshold-dependent; report at the operating point actually proposed."]];
const EVAL_CANDIDATES=[
 {id:"seasonal",n:"Seasonal baseline + 2σ",f:"Statistical baseline",st:"implemented"},

PAGES.evaluation = function(){
  const Sv=surveillance();
  const iso=S.ui.evIso||"NGA", showDemo=!!S.ui.showDemo;
  const country=Sv.countries.find(c=>c.iso===iso)||Sv.countries[0];
  const injMap={NGA:9,BRA:12,DEU:6,IND:8,GBR:5,COD:10,KEN:4,IDN:3};
  const inj=injMap[iso]||0, n=country.series.length;
  const refIdx={}; for(let i=0;i<inj;i++) refIdx[n-inj+i]=1;
  let demo=null;
  if(showDemo&&inj>0){
    demo=[detSeasonal(country.series,{k:2}),detEWMA(country.series,{}),detCUSUM(country.series,{}),detMAD(country.series,{}),detThreshold(country.series,{})]
      .map(r=>{let TP=0,FP=0,FN=0,TN=0,first=-1;
        r.flags.forEach((f,i)=>{const ref=!!refIdx[i];
          if(f.flag&&ref){TP++;if(first<0)first=i;} else if(f.flag&&!ref)FP++; else if(!f.flag&&ref)FN++; else TN++;});
        const sens=TP+FN?TP/(TP+FN):null, spec=TN+FP?TN/(TN+FP):null, ppv=TP+FP?TP/(TP+FP):null;
        return {id:r.id,name:r.name,TP:TP,FP:FP,FN:FN,TN:TN,sens:sens,spec:spec,ppv:ppv,
          f1:(ppv&&sens)?(2*ppv*sens)/(ppv+sens):null,delay:first>=0?first-(n-inj):null};});
  }
  const f=v=>v==null?"—":(v*100).toFixed(1)+"%";
  const cell=(d,val,st)=>'<td>'+(d?'<span class="num small">'+val+'</span>':'<span class="mono9 dimc" style="font-style:italic">'+(st==="implemented"?L.await_:"—")+'</span>')+'</td>';

  return pageHead({kicker:"Module 07",title:"Model Evaluation",ev:"PLAN",
      desc:"Comparison harness and metric contract. No validated performance figure exists in this build; cells are populated exclusively by executed experiment runs."})+
    callout("danger","No fabricated metrics — read this before interpreting anything below",
      'Every performance cell reads <span class="num">'+L.await_+'</span> because no model has been trained and no reference label set exists. '+
      'The optional demonstration below computes real arithmetic against a step that this prototype\'s own generator injected — it is '+
      '<b style="color:var(--text)">circular by construction</b> and is provided only to show the table layout. It is labelled DEMO METRIC and must never be quoted.')+
    '<div class="g g4 mt3">'+
      stat({label:"Models trained",value:"0",ev:"ESTABLISHED",sub:"No artefacts present"})+
      stat({label:"Reference label sets",value:"0",ev:"ESTABLISHED",sub:"Curation not started"})+
      stat({label:"Experiment runs completed",value:"0",ev:"ESTABLISHED",sub:"No execution backend in this build"})+
      stat({label:"Reportable metrics",value:"0",ev:"ESTABLISHED",color:"var(--muted)",sub:"By policy, not by omission"})+'</div>'+
    '<div class="mt3">'+panel({title:"Model comparison",ev:"PLAN",sub:"One row per candidate. Baselines are listed first and cannot be removed from the comparison.",
      actions:seg("evIso",iso,Sv.countries.filter(c=>c.state!=="GREEN").slice(0,4).map(c=>({v:c.iso,l:c.iso})))+
        '<button class="btn'+(showDemo?" on":"")+'" data-act="showDemo">'+(showDemo?"Hide":"Show")+' demo metrics</button>',
      body:'<div class="tablewrap"><table><thead><tr>'+["Model","Family","Status","Sens","Spec","PPV","F1","AUROC","FPR","Delay (wk)","Lead (wk)","Calibration"]
        .map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+
        EVAL_CANDIDATES.map(c=>{const d=demo?demo.find(x=>x.id===c.id):null;
          return '<tr><td><span class="small">'+c.n+'</span></td><td><span class="xs dimc">'+c.f+'</span></td>'+
            '<td><span class="mono9" style="color:'+(c.st==="implemented"?"var(--green)":c.st==="not-trained"?"var(--yellow)":"var(--dim)")+'">'+
            (c.st==="implemented"?"DETECTOR IN CODE":c.st==="not-trained"?"NOT TRAINED":"NOT STARTED")+'</span></td>'+
            cell(d,f(d&&d.sens),c.st)+cell(d,f(d&&d.spec),c.st)+cell(d,f(d&&d.ppv),c.st)+cell(d,f(d&&d.f1),c.st)+
            '<td><span class="mono9 dimc" style="font-style:italic">'+L.await_+'</span></td>'+
            cell(d,d?((d.FP/Math.max(1,d.FP+d.TN))*100).toFixed(1)+"%":"—",c.st)+
            cell(d,d&&d.delay!=null?d.delay:"—",c.st)+
            '<td><span class="mono9 dimc" style="font-style:italic">'+L.await_+'</span></td>'+
            '<td><span class="mono9 dimc" style="font-style:italic">'+L.await_+'</span></td></tr>';}).join("")+
        '</tbody></table></div>'+
        (showDemo?'<div class="mt2">'+banner("DEMO METRIC — computed against a synthetic step injected by this prototype. Circular; not evidence of detection ability.")+'</div>':"")})+'</div>'+
    '<div class="g g2 mt3">'+
      panel({title:"Confusion matrix",ev:demo?"SIMULATED":"PLAN",sub:"At the proposed operating point. Shown for the seasonal baseline detector.",
        body:demo?(function(){const d=demo[0];
          const cells=[["True positive",d.TP,"var(--green)"],["False positive",d.FP,"var(--orange)"],["False negative",d.FN,"var(--red)"],["True negative",d.TN,"var(--line2)"]];
          return '<div class="g g2" style="gap:8px">'+cells.map(c=>'<div class="item center" style="border-color:'+c[2]+'55;background:'+c[2]+'0d">'+
            '<div class="num" style="font-size:22px;font-weight:600;color:'+c[2]+'">'+c[1]+'</div><div class="label">'+c[0]+'</div></div>').join("")+'</div>'+
            '<p class="xs dimc mt2" style="line-height:1.6">Note the class imbalance: '+d.TN+' negative weeks against '+(d.TP+d.FN)+' reference weeks. '+
            'Accuracy here would exceed '+(((d.TP+d.TN)/(d.TP+d.TN+d.FP+d.FN))*100).toFixed(1)+'% for a detector that never fires — which is exactly why accuracy is not reported anywhere in this system.</p>';})()
          :'<div class="g g2" style="gap:8px">'+["True positive","False positive","False negative","True negative"].map(k=>
            '<div class="item center" style="border-style:dashed"><div class="num small dimc" style="font-style:italic">'+L.await_+'</div><div class="label">'+k+'</div></div>').join("")+'</div>'})+
      panel({title:"Calibration & reliability",ev:"PLAN",sub:"Reliability curve, Brier score and expected calibration error.",
        body:notImpl("Calibration assessment","Requires a model that outputs probabilities. Detectors currently emit unbounded scores, which must be mapped to calibrated probabilities (e.g. isotonic or Platt scaling on a validation window) before any probability is displayed to a user.")+
          '<div class="mt2">'+["Brier score","Expected calibration error","Reliability curve","Sharpness"].map(m=>
            '<div class="listrow"><span class="small mut" style="flex:1">'+m+'</span><span class="mono9 dimc" style="font-style:italic">'+L.await_+'</span></div>').join("")+'</div>'})+
    '</div>'+
    '<div class="mt3">'+panel({title:"Metric contract",ev:"ESTABLISHED",
      sub:"Every metric this platform is permitted to report, with its interpretation and its failure mode. Accuracy is deliberately absent.",
      body:table([{h:"Metric",r:r=>'<span class="small">'+r[0]+'</span>'},{h:"Definition",r:r=>'<span class="num xs mut">'+esc(r[1])+'</span>'},
        {h:"Why it is reported",r:r=>'<span class="small mut">'+r[2]+'</span>'},
        {h:"Failure mode",r:r=>'<span class="small" style="color:var(--yellow)">'+r[3]+'</span>'}],METRICS)})+'</div>'+
    '<div class="g g2 mt3">'+
      panel({title:"Evaluation protocol",ev:"PLAN",body:'<ol style="margin:0;padding-left:18px;color:var(--muted);font-size:11.5px;line-height:1.8">'+
        [["Pre-register","Hypothesis, label definition, split boundaries, primary metric and alarm-rate budget are written down and hashed before any model sees the test period."],
         ["Fit on train only","All preprocessing statistics — baselines, scalers, seasonal indices — are estimated inside the training window."],
         ["Tune on validation","Hyperparameters and thresholds are selected using rolling-origin validation, never the test period."],
         ["Single test evaluation","The test period is scored once. Repeated evaluation converts it into a validation set."],
         ["Report jointly","Sensitivity, PPV, alarm rate and detection delay are always reported together, with the baseline beside them."],
         ["Publish negatives","Runs where the baseline wins are recorded with the same prominence as any other run."]]
        .map(x=>'<li><b style="color:var(--text)">'+x[0]+'.</b> '+x[1]+'</li>').join("")+'</ol>'})+
      panel({title:"Error inspection (planned)",ev:"PLAN",body:notImpl("Error analysis workbench",
        "Will list every false negative and false positive with its series context, quality vector and candidate explanation, so that failure patterns — not aggregate scores — drive the next iteration.")+
        '<div class="mt2">'+["Missed events ranked by magnitude","False alarms grouped by suspected cause","Performance stratified by data completeness",
          "Performance stratified by region and reporting delay","Sensitivity of conclusions to threshold choice"]
          .map(x=>'<div class="item spread"><span class="small mut">'+x+'</span><span class="mono9 dimc">PLANNED</span></div>').join("")+'</div>'+
        '<div class="row mt2"><button class="btn" data-act="go" data-val="ml-lab">'+ico("flask",12)+' Configure a run</button>'+
        '<button class="btn" data-act="go" data-val="model-cards">'+ico("card",12)+' Model cards</button></div>'})+
    '</div>';
};

        (view==="frequency"?
          panel({title:"Placeholder lineage frequency over time",ev:"SIMULATED",sub:"Stacked share of synthetic submissions. Frequency ≠ fitness: submission bias dominates raw shares.",

const EV_TEMPLATES=[
 {type:"Official bulletin",extract:"Respiratory illness consultations described as elevated in a synthetic administrative area",pathogen:"Unspecified respiratory"},

    items.push(Object.assign({},t,{id:"EV-"+String(i+1).padStart(4,"0"),date:"2026-08-"+String(6+(i%15)).padStart(2,"0"),

      state:(S.ui.evstate&&S.ui.evstate["EV-"+String(i+1).padStart(4,"0")])||(i===0?"triage":i%5===0?"corroborated":i%7===0?"duplicate":"unverified")}));}
  const filter=S.ui.evfilter||"all", selId=S.ui.evId||"EV-0001";
  const list=items.filter(i=>filter==="all"||i.state===filter), sel=items.find(i=>i.id===selId)||items[0];

      stat({label:"Corroborated by official source",value:items.filter(i=>i.state==="corroborated").length,ev:"SIMULATED",color:"var(--data)",sub:"Still not a confirmed event"})+

          body:table([{h:"ID",r:x=>'<button class="btn" style="border:0;background:none;padding:0;color:var(--text)" data-act="evId" data-val="'+x.id+'"><span class="num xs">'+x.id+'</span></button>'},
            {h:"Date",r:x=>'<span class="num xs dimc">'+x.date+'</span>'},{h:"Source type",r:x=>'<span class="xs mut">'+x.type+'</span>'},
            {h:"Location",r:x=>'<span class="xs mut">'+x.location+'</span>'},{h:"Pathogen",r:x=>'<span class="xs mut">'+x.pathogen+'</span>'},
            {h:"Extracted signal",r:x=>'<span class="small">'+x.extract+'</span>'},
            {h:"Verification",align:"right",r:x=>'<span class="mono9" style="color:'+VERIF[x.state].c+'">'+VERIF[x.state].l+'</span>'}],list)})+
        panel({title:sel.id+" — review record",ev:"SIMULATED",sub:"Everything an analyst needs to decide whether this warrants checking an official source.",
          body:'<div class="g g2">'+
            kv([["Source",sel.source,false],["Source type",sel.type,false],["Date",sel.date],["Location as stated",sel.location+" (not geocoded — synthetic)",false],["Pathogen as stated",sel.pathogen,false]])+
            kv([["Extracted signal",sel.extract,false],["Extraction method","Rule-based template match (NLP model not implemented)",false],
                ["Extraction confidence",sel.confidence,false],["Corroborating official source",sel.state==="corroborated"?"One synthetic official bulletin":"None identified",false],

      '</div>'+

        panel({title:"Source-type composition",ev:"SIMULATED",body:hBarChart(Object.keys(byType).map(k=>({name:k,value:byType[k]})),{color:"var(--event)"})})+

            .map(t=>'<div class="listrow" style="display:block"><div class="row" style="gap:8px">'+dot(t[2])+'<span class="small">'+t[0]+'</span></div>'+

      '</div></div>';

PAGES.quality = function(){
  const Sv=surveillance();
  const rows=Sv.countries.map(c=>{const r=rng("dq:"+c.iso);
    return {iso:c.iso,name:c.name,stream:c.pathogen.name,
      completeness:c.availability==="none"?null:c.completeness,delay:c.availability==="none"?null:c.delayWeeks,
      dupes:c.availability==="none"?null:+(r()*2.6).toFixed(2),invalid:c.availability==="none"?null:+(r()*1.8).toFixed(2),
      gaps:c.availability==="none"?null:Math.floor(r()*6),fresh:c.availability==="none"?null:Math.floor(r()*72),
      rel:c.availability==="none"?null:+(.5+r()*.45).toFixed(2)};});
  const wd=rows.filter(r=>r.completeness!==null);
  const mean=k=>wd.reduce((a,r)=>a+r[k],0)/wd.length;
  const delays=synthDelay("dq:global");
  const issues=[
    {id:"DQ-001",sev:"high",dim:"Coverage",d:"Territories with no configured stream must not be rendered as 'no activity'.",aff:"Any territory with availability = none",act:"Render hatched on maps; exclude from denominators."},
    {id:"DQ-002",sev:"high",dim:"Timeliness",d:"Most recent 2–3 weeks are provisional in every stream due to reporting delay.",aff:"All streams",act:"Down-weight recent weeks; never trigger escalation on the leading edge alone."},
    {id:"DQ-003",sev:"medium",dim:"Completeness",d:"Sparse-reporting territories fall below 60% completeness, widening baseline intervals and suppressing detection.",aff:"ETH, PAK, CHN (synthetic)",act:"Report detection sensitivity as capacity-limited for these series."},
    {id:"DQ-004",sev:"medium",dim:"Consistency",d:"Confirmed counts occasionally exceed suspected counts in the synthetic composition frame.",aff:"Disease Intelligence composition panel",act:"Add a cross-field validation rule before any real data is bound."},
    {id:"DQ-005",sev:"low",dim:"Uniqueness",d:"Duplicate-record rate under 3% in synthetic frames.",aff:"All streams",act:"Monitor; hash-based dedupe already specified in the recipe."},
    {id:"DQ-006",sev:"high",dim:"Stability",d:"No schema-change detection exists yet; a source-side definition change would pass silently.",aff:"All connectors",act:"Implement schema fingerprinting before enabling any live connector."}];
  const sevc={high:"var(--red)",medium:"var(--orange)",low:"var(--yellow)"};
  const DIMS=[["Completeness","What fraction of expected reporting units actually reported?"],["Timeliness","How long between event and availability?"],
    ["Validity","Do values conform to type, range and vocabulary?"],["Consistency","Do related fields agree (cases ≥ confirmed, sums = totals)?"],
    ["Uniqueness","Are records duplicated across submissions or revisions?"],["Coverage","Which geographies and periods are represented at all?"],
    ["Stability","Does the schema or definition change over time?"]];

 ["Minimum aggregation","Suppression of small cells to prevent re-identification","planned","Required before any sub-national or molecular-cluster display."],

        '<div class="row" style="gap:10px">'+
          '<button class="burger" data-act="burger">'+ico("menu",18)+'</button>'+
          pill(ico("net",10)+" v0.4.0-single-file","var(--line2)")+
          '<span class="xs dimc" style="display:none">'+routeTitle(S.route)+'</span></div>'+
        '<div class="row" style="gap:10px">'+
          '<span class="row" style="gap:8px">'+tag("PLAN")+'<span class="num xs dimc">'+fmtTs()+'</span></span>'+
          '<span class="seg">'+Object.keys(MODES).map(k=>'<button data-act="mode" data-val="'+k+'" class="'+(S.mode===k?"on":"")+'"'+
            (S.mode===k?' style="background:'+MODES[k].c+'"':'')+'>'+(k==="DEMONSTRATION"?"DEMO":k)+'</button>').join("")+'</span>'+
          '<button class="btn" data-act="go" data-val="access">'+ico("user",13)+' '+((S.session&&S.session.name)||"Guest — read only")+'</button>'+
        '</div>'+
      '</header>'+
      '<div class="standing">'+ico("info",12)+
        '<span>Research prototype. Alert states are interface states, not public-health decisions. Nothing here confirms an outbreak or constitutes a diagnosis.</span>'+
        '<span class="mono10" style="margin-left:auto;color:'+m.c+'">'+m.badge+'</span></div>'+
      '<main class="content grid-bg"><div class="wrap" id="page">'+inner+
        '<footer style="border-top:1px solid var(--line);margin-top:32px;padding-top:16px;font-size:10px;line-height:1.7;color:var(--dim)">'+
        'BIOWATCH-AI research prototype · single-file build · interface demonstration of a proposed architecture · '+
        'no validated model performance is reported anywhere in this build · synthetic values are generated deterministically in-browser and labelled SIMULATED.</footer>'+
      '</div></main>'+
    '</div></div>';
}
function render(){
  const app=document.getElementById("app");
  const fn=PAGES[S.route]||PAGES.app;
  let html;
  try{ html=fn(); }
  catch(err){
    html=pageHead({kicker:"Error",title:"Module failed to render",ev:"ESTABLISHED",
      desc:"This is a genuine runtime error, reported rather than hidden."})+
      callout("danger","Render error",'<pre>'+esc(String(err&&err.stack||err))+'</pre>');
    if(window.console) console.error(err);
  }
  app.innerHTML=(S.route==="landing"||S.route==="access")?html:shell(html);
  app.removeAttribute("aria-busy");
  const c=document.querySelector(".content"); if(c) c.scrollTop=0;
  window.scrollTo(0,0);
}
function go(route){
  S.route=route; S.sidebarOpen=false;
  /* hash sync is best-effort: some file:// and sandboxed contexts reject it */
  try{ if(location.hash!=="#"+route) history.replaceState(null,"","#"+route); }catch(e){ try{location.hash=route;}catch(e2){} }
  render();
}
function download(name,text,type){
  const blob=new Blob([text],{type:type||"text/plain"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------------- event delegation ---------------- */
document.addEventListener("click",function(e){
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.getAttribute("data-act"), val=t.getAttribute("data-val");
  const U=S.ui;
  switch(act){
    case "go": go(val); return;
    case "burger": S.sidebarOpen=!S.sidebarOpen; render(); return;
    case "mode": S.mode=val; saveState(); render(); return;
    case "role": U.role=val; render(); return;
    case "enter":
      { const r=ROLES.find(x=>x.id===(U.role||"researcher"));
        S.session={name:(U.accname||"").trim()||"Demo researcher",role:r.name,roleId:r.id,at:new Date().toISOString()};
        saveState(); go("app"); return; }
    case "clearsession": S.session=null; saveState(); render(); return;
    case "resetall": try{localStorage.clear();}catch(err){} location.reload(); return;
    /* map / disease / signal engine */
    case "layer": U.layer=val; render(); return;
    case "mproj": U.mproj=val; render(); return;
    case "pickcountry": U.selIso=val; U.sigIso=val; render(); return;
    case "pid": U.pid=val; render(); return;
    case "win": U.win=val; render(); return;
    case "stage": U.stage=val; render(); return;
    case "k": U.k=val; render(); return;
    case "toggledet":
      { const cur=U.dets||["seasonal","ewma","cusum","mad"];
        U.dets=cur.indexOf(val)>=0?cur.filter(x=>x!==val):cur.concat([val]); render(); return; }
    /* alerts */
    case "afilter": U.afilter=val; render(); return;
    case "alertId": U.alertId=val; render(); return;
    case "adjudicate":
      { const Sv=surveillance(), id=U.alertId||Sv.alerts[0].id;
        U.astatus=U.astatus||{}; U.astatus[id]=val;
        U.alog=[{id:id,status:val,at:fmtTs(),by:(S.session&&S.session.name)||"Guest (read-only)",
          note:(U.arationale||"").trim()||"(no rationale recorded)"}].concat(U.alog||[]);
        U.arationale=""; render(); return; }
    /* xai / eval / cards */
    case "xaiId": U.xaiId=val; render(); return;
    case "evIso": U.evIso=val; render(); return;
    case "showDemo": U.showDemo=!U.showDemo; render(); return;
    case "cardId": U.cardId=val; render(); return;
    case "exportcard":
      { const c=CARDS.find(x=>x.id===(U.cardId||"MC-001"));
        download(c.id+"-model-card.md",
          "# Model Card — "+c.name+"\n\n**Card ID:** "+c.id+"  \n**Kind:** "+c.kind+"  \n**Trained:** NO — no fitted model exists  \n**Version:** "+c.version+
          "  \n**Date:** "+c.date+"  \n**Researcher:** "+c.who+"\n\n## Dataset\n"+c.dataset+"\n\n## Features\n"+c.features+"\n\n## Target\n"+c.target+
          "\n\n## Periods\n- Training: "+c.train+"\n- Validation: "+c.val+"\n- Test: "+c.test+"\n\n## Preprocessing\n"+c.pre+"\n\n## Hyperparameters\n"+c.hyper+
          "\n\n## Metrics\n"+L.await_+"\n\n## Limitations\n"+c.limits.map(x=>"- "+x).join("\n")+"\n\n## Known biases\n"+c.biases.map(x=>"- "+x).join("\n")+
          "\n\n## Intended use\n"+c.intended+"\n\n## NOT intended for\n"+c.not+
          "\n\n---\nGenerated by the BIOWATCH-AI single-file research prototype on "+fmtTs()+
          ".\nThis card reports no validated performance. BIOWATCH-AI is not a clinical diagnostic or operational public-health system.\n","text/markdown"); return; }
    /* genomic / bio / env / events */
    case "gpath": U.gpath=val; render(); return;
    case "gview": U.gview=val; render(); return;
    case "bioId": U.bioId=val; render(); return;
    case "site": U.site=val; render(); return;
    case "etarget": U.etarget=val; render(); return;
    case "norm": U.norm=val; render(); return;
    case "evfilter": U.evfilter=val; render(); return;
    case "evId": U.evId=val; render(); return;
    case "evstate": U.evstate=U.evstate||{}; U.evstate[U.evId||"EV-0001"]=val; render(); return;
    /* connectors */
    case "connStream": U.connStream=val; render(); return;
    case "connId": U.connId=val; render(); return;
    case "conntest":
      { const id=U.connId||CONNECTORS[0].id; U.connTest=U.connTest||{};
        U.connTest[id]={at:fmtTs(),outcome:"NOT ATTEMPTED",
          detail:"No network request was issued. Connector calls must originate from a server-side ingestion service so that credentials, rate limits, caching and licence compliance are enforced centrally. A browser-side fetch would also be blocked by cross-origin policy for most of these sources."};
        render(); return; }
    /* ml lab */
    case "mlfeat":
      { const cur=U.mlfeats||["lag1","lag4","roll4","wow","resid"];
        U.mlfeats=cur.indexOf(val)>=0?cur.filter(x=>x!==val):cur.concat([val]); render(); return; }
    case "mlmodel":
      { const cur=U.mlmodels||["seasonal","logreg","rf"];
        U.mlmodels=cur.indexOf(val)>=0?cur.filter(x=>x!==val):cur.concat([val]); render(); return; }
    case "mlack": U.mlack=!U.mlack; render(); return;
    case "exportspec": download((U._spec.experiment_id||"experiment")+".json",JSON.stringify(U._spec,null,2),"application/json"); return;
    case "queue":
      { const sp=U._spec;
        U.queued=(U.queued||[]).concat([{id:sp.experiment_id,title:"Queued from ML Lab",hyp:"User-configured run.",ds:sp.dataset,
          target:sp.target,models:sp.models.join(", "),split:sp.split,status:"PENDING_EXECUTION",result:L.await_,created:fmtTs(),
          who:(S.session&&S.session.name)||"Guest"}]);
        U.runId=sp.experiment_id; go("experiments"); return; }
    /* workspace */
    case "prestep":
      { const cur=U.steps||["dedupe","geo","week","missing"];
        U.steps=cur.indexOf(val)>=0?cur.filter(x=>x!==val):cur.concat([val]); render(); return; }
    case "regds":
      { const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
        const name=g("ds-name"); if(!name) return;
        U.datasets=(U.datasets||[]).concat([{id:"DS-"+String((U.datasets||[]).length+1).padStart(3,"0"),name:name,
          source:g("ds-source"),license:g("ds-license"),period:g("ds-period"),notes:g("ds-notes"),
          status:"REGISTERED — NOT INGESTED",registered:fmtTs()}]);
        render(); return; }
    case "exportws":
      download("biowatch-workspace-export.json",JSON.stringify({steps:U.steps||[],datasets:U.datasets||[],exported:fmtTs(),
        note:"BIOWATCH-AI prototype export — contains no results, no validated performance and no real data."},null,2),"application/json"); return;
    /* experiments / decisions */
    case "runId": U.runId=val; render(); return;
    case "decId": U.decId=val; render(); return;
    case "exportdec":
      download("biowatch-decision-log.md","# BIOWATCH-AI — Research Decision Log\n\nExported "+fmtTs()+"\n\n"+
        DECISIONS.map(d=>"## "+d.id+" — "+d.dec+"\n\n- **Date:** "+d.date+"\n- **Area:** "+d.area+"\n- **Reason:** "+d.why+
          "\n- **Evidence:** "+d.ev+"\n- **Alternative considered:** "+d.alt+"\n- **Status:** "+d.status+"\n").join("\n"),"text/markdown"); return;
    /* architecture / responsible / africa / settings */
    case "layerId": U.layerId=val; render(); return;
    case "rtab": U.rtab=val; render(); return;
    case "ascope": U.ascope=val; render(); return;
    case "apath": U.apath=val; render(); return;
    case "stateId": U.stateId=val; render(); return;
    case "stateSel": U.stateId=val; render(); return;
    default: return;
  }
});
document.addEventListener("change",function(e){
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.getAttribute("data-act"), U=S.ui;
  if(t.tagName==="SELECT"||t.type==="range"){
    const map={mpath:"mpath",sigIso:"sigIso",mlds:"mlds",mltarget:"mltarget",mlcv:"mlcv",mltrain:"mltrain",
      decArea:"decArea",thK:"thK",thP:"thP",thH:"thH"};
    if(map[act]){ U[map[act]]=t.value; render(); }
  }
});
document.addEventListener("input",function(e){
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.getAttribute("data-act");
  if(act==="accname") S.ui.accname=t.value;
  if(act==="arationale") S.ui.arationale=t.value;
});
window.addEventListener("hashchange",function(){
  const r=location.hash.replace("#","")||"landing";
  if(PAGES[r]&&r!==S.route){ S.route=r; render(); }
});

/* ---------------- boot ---------------- */
loadState();
(function boot(){
  const r=location.hash.replace("#","");
  S.route=(r&&PAGES[r])?r:"landing";
  render();
  /* Console-visible integrity statement: anyone inspecting this build
     should immediately see what it does and does not contain. */
  if(window.console&&console.info){
    console.info("%cBIOWATCH-AI — research prototype (single file)","color:#45c9b8;font-weight:600");
    console.info("No trained model. No validated performance metric. No real surveillance data.\n"+
      "All demonstration values are deterministic synthetic output labelled SIMULATED.\n"+
      "Synthetic engine provenance: "+SYNTH_PROVENANCE);
  }
})();
</script>
