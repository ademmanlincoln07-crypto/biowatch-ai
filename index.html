<!--
================================================================================
  BIOWATCH-AI — SINGLE-FILE RESEARCH PROTOTYPE  (v0.4.0-single)
  AI-assisted biological surveillance & early outbreak signal detection
================================================================================

  WHAT THIS FILE IS
  -----------------
  The entire prototype — design system, data layer, statistical detectors,
  world map, 25 modules, router — in ONE self-contained HTML file.
  No build step, no framework, no CDN, no network access required.
  Open it in any modern browser, or double-click it. That is all.

  WHAT THIS FILE IS NOT
  ---------------------
  * NOT a clinical diagnostic device.
  * NOT an operational public-health system.
  * NOT evidence of anything: no model has been trained, no reference label
    set exists, and no validated performance figure appears anywhere.
  * NOT a source of real surveillance data: every demonstration value is
    deterministic synthetic output labelled SIMULATED at its point of use.
  * NOT a record of the research programme. The official BIOWATCH-AI
    Research & Development Master Log is separate and untouched by this work.

  STRUCTURAL HONESTY RULES ENFORCED IN THE CODE BELOW
  ---------------------------------------------------
  1. Baseline before model. The machine-learning stage is inert and cannot
     contribute to any signal.
  2. Every figure carries an epistemic tag: ESTABLISHED / ASSUMPTION /
     HYPOTHESIS / PRELIMINARY / PREDICTION / PLAN / SIMULATED.
  3. Constrained vocabulary: the interface can say "Signal detected" or
     "Unusual activity"; it can never say "outbreak confirmed". No code path
     declares an outbreak at any privilege level.
  4. Missing data is hatched and labelled DATA NOT AVAILABLE — never green.
  5. Where a real experiment would be needed, the UI prints "Awaiting
     experiment" instead of a plausible-looking number.
  6. Unconfigured connectors say so; synthetic values are never substituted
     for live data.

  SECTION MAP (search for these markers)
  --------------------------------------
    [S1]  Design system (CSS)
    [S2]  Epistemic vocabulary & safe language
    [S3]  Deterministic synthetic data engine
    [S4]  Domain registries (pathogens, geography, streams)
    [S5]  Connector registry (14 public sources, 0 configured)
    [S6]  Detection methods (real, running code)
    [S7]  Derived surveillance state
    [S8]  UI primitives
    [S9]  Chart renderers (inline SVG)
    [S10] World map renderer
    [S11] Modules / pages
    [S12] Shell, router, boot
================================================================================
-->
<style>
/* ============================================================ [S1]
   DESIGN SYSTEM
   Scientific / public-health intelligence aesthetic: dark low-chroma
   substrate, restrained functional colour, no neon, no gaming glow,
   no decorative motion. Accessible contrast on every text pairing.
   ============================================================ */
:root{
  --void:#070b0f; --base:#0b1117; --panel:#111a22; --panel2:#16212b;
  --line:#1e2c37; --line2:#2a3b49;
  --text:#e6eef5; --muted:#93a7b8; --dim:#62788a;
  --primary:#2ea89a; --primary-br:#45c9b8;
  --genomic:#8b7ad6; --data:#4a90c4; --env:#4bb1a8; --lab:#c9a227; --event:#a98bd6;
  --green:#3fa66b; --yellow:#d7b23c; --orange:#d9822b; --red:#cf4a4a;
  --ev-established:#3fa66b; --ev-assumption:#8f9bb3; --ev-hypothesis:#8b7ad6;
  --ev-preliminary:#d7b23c; --ev-prediction:#4a90c4; --ev-plan:#6b7f91; --ev-simulated:#d9822b;
  --sans:"Inter","IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--base);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--primary-br);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary-br);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#22323f;border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#33485a;background-clip:content-box}

.grid-bg{background-image:linear-gradient(rgba(120,160,185,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,185,.05) 1px,transparent 1px);background-size:28px 28px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mut{color:var(--muted)}.dimc{color:var(--dim)}
.h1{font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0}
.h2{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0}
.small{font-size:11px}.xs{font-size:10px}
.mono9{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.mono10{font-family:var(--mono);font-size:10px;letter-spacing:.1em}
.center{text-align:center}.right{text-align:right}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mt1{margin-top:6px}.mt2{margin-top:10px}.mt3{margin-top:16px}.mb2{margin-bottom:10px}.mb3{margin-bottom:16px}

/* ---------- layout ---------- */
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:250px;flex:0 0 250px;background:var(--void);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side-h{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.side-nav{flex:1;overflow-y:auto;padding:8px 0}
.side-f{border-top:1px solid var(--line);padding:10px;flex:0 0 auto}
.navgroup{margin-bottom:12px}
.navgroup>.label{padding:0 12px 4px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 12px;color:var(--muted);font-size:12px;border-left:2px solid transparent;cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.navitem:hover{background:rgba(17,26,34,.8);color:var(--text)}
.navitem.on{background:rgba(46,168,154,.1);color:var(--text);border-left-color:var(--primary-br)}
.navitem .ico{flex:0 0 16px;opacity:.8}
.navitem .st{width:6px;height:6px;border-radius:50%;margin-left:auto;flex:0 0 auto;opacity:.7}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;background:var(--void);border-bottom:1px solid var(--line)}
.standing{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;background:rgba(17,26,34,.6);border-bottom:1px solid var(--line);font-size:10.5px;color:var(--dim)}
.content{flex:1;overflow-y:auto}
.wrap{max-width:1680px;margin:0 auto;padding:16px 20px 40px}
.burger{display:none;background:none;border:0;color:var(--muted);padding:6px}
@media(max-width:1024px){
  .side{position:fixed;z-index:80;height:100%;transform:translateX(-100%);transition:transform .15s}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .burger{display:block}
  .wrap{padding:14px 12px 40px}
}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.body{padding:12px;min-width:0;flex:1}
.panel .sub{margin:2px 0 0;font-size:11px;line-height:1.35;color:var(--dim)}
.accent{border-top-width:2px;border-top-style:solid}

.g{display:grid;gap:12px;grid-template-columns:1fr}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.gside{grid-template-columns:minmax(0,1fr) 350px}
.gside-l{grid-template-columns:320px minmax(0,1fr)}
@media(max-width:1350px){.gside,.gside-l{grid-template-columns:1fr}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

/* ---------- atoms ---------- */
.tag{display:inline-flex;align-items:center;padding:1px 5px;border-radius:2px;border:1px solid;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:2px;border:1px solid;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1;margin-top:6px}
.stat .s{font-size:11px;color:var(--muted);margin-top:4px}
.stat .hint{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.35}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:2px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:11px}
.btn:hover{border-color:var(--line2);color:var(--text)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#04120f;font-weight:500}
.btn.pri:hover{background:var(--primary-br)}
.btn.out{background:transparent;border-color:rgba(46,168,154,.5);color:var(--primary-br)}
.btn.on{border-color:var(--primary);background:rgba(46,168,154,.12);color:var(--text)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--panel2);flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line);background:none;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px}
.seg button:last-child{border-right:0}
.seg button:hover{background:rgba(30,44,55,.6);color:var(--text)}
.seg button.on{color:#08121a;font-weight:600}
select,input[type=text],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:2px;color:var(--text);padding:6px 8px;font:12px var(--sans)}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--primary)}
input[type=range]{width:100%;accent-color:var(--primary)}
input[type=checkbox]{accent-color:var(--primary);width:14px;height:14px}
.field{display:block;margin-bottom:10px}
.field>.label{display:block;margin-bottom:4px}
.field .hint{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.35}

.callout{border:1px solid;border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.55;color:var(--muted)}
.callout .ct{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;display:block}
.banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--ev-simulated);background:rgba(217,130,43,.07);border-radius:4px;padding:7px 10px}
.banner b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ev-simulated);font-weight:500}
.notimpl{border:1px dashed var(--line2);background:rgba(22,33,43,.4);border-radius:4px;padding:14px}
.nodata{border:1px solid var(--line);background:rgba(22,33,43,.5);border-radius:4px;padding:16px;text-align:center}
.nodata .t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim)}

table{width:100%;border-collapse:collapse;text-align:left}
.tablewrap{overflow-x:auto}
th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:400;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;font-size:12px;border-bottom:1px solid rgba(30,44,55,.6);vertical-align:top}
tbody tr:hover{background:rgba(22,33,43,.6)}
tbody tr:last-child td{border-bottom:0}

.meter{height:6px;background:rgba(30,44,55,.7);border-radius:2px;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:2px}
.kv{display:grid;gap:8px 24px}
.kv.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:720px){.kv.two{grid-template-columns:1fr}}
.kv .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kv .v{font-size:12px;margin-top:2px;word-break:break-word}
.kv>div{border-bottom:1px solid rgba(30,44,55,.5);padding-bottom:6px}
.item{border:1px solid var(--line);background:rgba(22,33,43,.4);border-radius:3px;padding:8px 10px}
.item+.item{margin-top:6px}
.listrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(30,44,55,.5)}
.listrow:last-child{border-bottom:0}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{display:flex;gap:8px;font-size:11.5px;line-height:1.5;color:var(--muted);margin-bottom:6px}
ul.clean li:before{content:"·";color:var(--primary);font-weight:700}
ul.tick li:before{content:"✓";color:var(--green);font-size:10px}
ul.cross li:before{content:"✕";color:var(--red);font-size:10px}
ul.warn li:before{content:"▲";color:var(--yellow);font-size:9px}
pre{margin:0;background:#0a1218;border:1px solid var(--line);border-radius:3px;padding:10px;overflow:auto;font:10.5px/1.6 var(--mono);color:var(--muted)}
details{border:1px solid var(--line);background:rgba(22,33,43,.4);border-radius:4px;margin-bottom:6px}
details>summary{padding:8px 10px;font-size:12px;color:var(--text);cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"+ ";color:var(--dim);font-family:var(--mono)}
details[open]>summary:before{content:"− "}
details>div{padding:0 10px 10px;font-size:11.5px;line-height:1.6;color:var(--muted)}
.pipe{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
.stage{flex:0 0 116px;text-align:left;border:1px solid var(--line);background:rgba(22,33,43,.5);border-radius:3px;padding:7px 8px;color:var(--muted)}
.stage.on{border-color:var(--primary);background:rgba(46,168,154,.1);color:var(--text)}
.arrow{align-self:center;color:var(--line2);flex:0 0 auto}
svg{display:block;max-width:100%}
.chart text{font-family:var(--mono)}
.maphold{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#08121a}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:7px 9px;font-size:11px;max-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.land{cursor:pointer}
.land:hover{stroke:var(--primary-br);stroke-width:1}

/* ---------- landing ---------- */
.lp-nav{position:sticky;top:0;z-index:50;background:rgba(7,11,15,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.lp-wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.lp-sec{border-top:1px solid var(--line);padding:54px 24px}
.lp-sec>div{max-width:1180px;margin:0 auto}
.hero-h{font-size:52px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:0}
@media(max-width:720px){.hero-h{font-size:36px}}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;max-width:1180px;margin:0 auto}
@media(max-width:1024px){.hero-grid{grid-template-columns:1fr}}
</style>
</head>

/* ============================================================ [S6]
   DETECTION METHODS — REAL, RUNNING CODE
   Classical statistical detectors implemented FIRST so that any
   machine-learning method has a mandatory comparator. Nothing here
   is a trained model; nothing here has been validated against real
   outbreak labels.
   ============================================================ */
function detThreshold(s,o){
  const t = (o&&o.threshold) || Math.round(Math.max.apply(null,s.map(p=>p.value))*0.72);
  return {id:"threshold",name:"Fixed threshold",params:{threshold:t},
    flags:s.map(p=>({date:p.date,flag:p.value>t,score:+(p.value/t).toFixed(2),expected:t})),
    note:"Crudest possible rule. Included because it is frequently the incumbent in practice and any method must beat it."};
}
function detSeasonal(s,o){
  const k=(o&&o.k)||2, minH=52;
  const flags=s.map((p,i)=>{
    if(i<minH) return {date:p.date,flag:false,score:0,insufficient:true};
    const hist=s.slice(0,i).filter(q=>q.week===p.week).map(q=>q.value);
    const pool=hist.length>=2?hist:s.slice(Math.max(0,i-8),i).map(q=>q.value);
    const mu=pool.reduce((a,b)=>a+b,0)/pool.length;
    let sd=Math.sqrt(pool.reduce((a,b)=>a+Math.pow(b-mu,2),0)/Math.max(1,pool.length-1))||Math.sqrt(Math.max(1,mu));
    const z=(p.value-mu)/(sd||1);
    return {date:p.date,flag:z>=k,score:+z.toFixed(2),expected:Math.round(mu)};
  });
  return {id:"seasonal",name:"Seasonal baseline (same-week mean + "+k+"σ)",params:{k:k,minHistory:minH},flags:flags,
    note:"Comparable in spirit to EARS-family and Farrington-style approaches, but simplified: no over-dispersion model, no trend term, no exclusion of past epidemic periods."};
}
function detEWMA(s,o){
  const lam=(o&&o.lambda)||.3, Lc=(o&&o.L)||3, w=8; let e=null;
  const flags=s.map((p,i)=>{
    const win=s.slice(Math.max(0,i-w),i).map(q=>q.value);
    const mu=win.length?win.reduce((a,b)=>a+b,0)/win.length:p.value;
    let sd=win.length>1?Math.sqrt(win.reduce((a,b)=>a+Math.pow(b-mu,2),0)/(win.length-1)):Math.sqrt(Math.max(1,mu));
    sd=sd||Math.sqrt(Math.max(1,mu));
    e=e===null?p.value:lam*p.value+(1-lam)*e;
    const lim=mu+Lc*sd*Math.sqrt(lam/(2-lam));
    return {date:p.date,flag:i>w&&e>lim,score:+((e-mu)/(sd||1)).toFixed(2),expected:Math.round(mu)};
  });
  return {id:"ewma",name:"EWMA control chart (λ="+lam+", L="+Lc+")",params:{lambda:lam,L:Lc,window:w},flags:flags,
    note:"Sensitive to small persistent shifts; weak against sharp single-week spikes. Assumes approximately stationary residuals, which surveillance data violate."};
}
function detCUSUM(s,o){
  const k=(o&&o.k2)||.5, h=(o&&o.h)||4, w=12; let S=0;
  const flags=s.map((p,i)=>{
    const win=s.slice(Math.max(0,i-w),i).map(q=>q.value);
    const mu=win.length?win.reduce((a,b)=>a+b,0)/win.length:p.value;
    let sd=win.length>1?Math.sqrt(win.reduce((a,b)=>a+Math.pow(b-mu,2),0)/(win.length-1)):Math.sqrt(Math.max(1,mu));
    sd=sd||Math.sqrt(Math.max(1,mu));
    S=Math.max(0,S+(p.value-mu)/sd-k);
    const flag=i>w&&S>h; if(flag) S=0;
    return {date:p.date,flag:flag,score:+S.toFixed(2),expected:Math.round(mu)};
  });
  return {id:"cusum",name:"CUSUM (k="+k+", h="+h+")",params:{k:k,h:h,window:w},flags:flags,
    note:"Accumulates evidence; good at detecting sustained gradual shifts, but signalling time depends strongly on the reset policy."};
}
function detMAD(s,o){
  const k=(o&&o.kmad)||3.5, w=26;
  const flags=s.map((p,i)=>{
    const win=s.slice(Math.max(0,i-w),i).map(q=>q.value);
    if(win.length<6) return {date:p.date,flag:false,score:0,insufficient:true};
    const sorted=win.slice().sort((a,b)=>a-b), med=sorted[Math.floor(sorted.length/2)];
    const devs=win.map(v=>Math.abs(v-med)).sort((a,b)=>a-b), mad=devs[Math.floor(devs.length/2)]||1;
    const sc=(p.value-med)/(1.4826*mad);
    return {date:p.date,flag:sc>=k,score:+sc.toFixed(2),expected:med};
  });
  return {id:"mad",name:"Robust MAD rule (k="+k+")",params:{k:k,window:w},flags:flags,
    note:"Resistant to contamination by previous outbreaks in the training window — a common failure mode of mean/SD baselines."};
}

function detectorAgreement(res){
  const m={};
  res.forEach(a=>{m[a.id]={};res.forEach(b=>{
    const n=Math.min(a.flags.length,b.flags.length);let ag=0,both=0,either=0;
    for(let i=0;i<n;i++){if(a.flags[i].flag===b.flags[i].flag)ag++;if(a.flags[i].flag&&b.flags[i].flag)both++;if(a.flags[i].flag||b.flags[i].flag)either++;}
    m[a.id][b.id]={agreement:+(ag/n).toFixed(3),jaccard:either?+(both/either).toFixed(3):null};
  });});
  return m;
}

  {iso:"THA",p:"dengue",     inj:0, sz:0,  lv:180, st:["epi","lab"]},
  {iso:"AUS",p:"influenza-a",inj:0, sz:0,  lv:240, st:["epi","lab","genomic"]},
  {iso:"GHA",p:"cholera",    inj:0, sz:0,  lv:45,  st:["epi"],av:"none"},
  {iso:"CHN",p:"influenza-a",inj:0, sz:0,  lv:700, st:["epi"],av:"sparse"},
  {iso:"ITA",p:"influenza-a",inj:0, sz:0,  lv:260, st:["epi","synd"]}
];
function evaluateSeries(series,opt){
  const z1=(opt&&opt.z1)||2, z2=(opt&&opt.z2)||3, persist=(opt&&opt.persist)||2;
  const marked=series.map(p=>Object.assign({},p,{flag:p.z>=z1?p.value:undefined}));
  const last=marked[marked.length-1];
  let consec=0; for(let i=marked.length-1;i>=0;i--){ if(marked[i].z>=z1) consec++; else break; }
  const maxZ=Math.max.apply(null,marked.slice(-4).map(p=>p.z));
  let state="GREEN";
  if(last.z>=z1&&consec>=persist) state="ORANGE"; else if(last.z>=z1) state="YELLOW";
  if(last.z>=z2&&consec>=persist) state="RED";
  if(state==="GREEN"&&maxZ>=z1) state="YELLOW";
  return {series:marked,last:last,state:state,consecutive:consec,maxZ:+maxZ.toFixed(2),z:last.z};
}
const ALT_EXPL = {
  epi:["Change in case definition or reporting form at the source","Catch-up reporting after a backlog or public holiday","Increased testing capacity raising ascertainment without a change in incidence","Duplicate records introduced during a data migration"],
  lab:["Laboratory reagent or platform change affecting positivity","Referral pattern shift concentrating specimens at one facility","Seasonal testing campaign inflating denominators"],
  env:["Rainfall dilution or industrial discharge altering wastewater concentration","Change in sampling site, flow normalisation or assay","Sampling frequency change creating an apparent trend"],
  synd:["Co-circulating pathogen producing the same syndrome","Media attention increasing care-seeking behaviour","Change in the sentinel practice panel"],
  genomic:["Sequencing bias — targeted sequencing of unusual specimens","Change in submission cadence by a contributing laboratory"]
};
let _surv=null;
function surveillance(){
  if(_surv) return _surv;
  const countries = SCENARIOS.map(sc=>{
    const geo=COUNTRIES.find(c=>c.iso===sc.iso), path=PATHOGENS.find(p=>p.id===sc.p), key=sc.iso+":"+sc.p;
    const series=synthSeries(key,{weeks:104,level:sc.lv,season:sc.p==="lassa"?.7:.45,injectAt:sc.inj||null,injectSize:sc.sz,disp:.2,
      phase:(sc.iso.charCodeAt(0)+sc.iso.charCodeAt(2))%52});
    const ev=evaluateSeries(series), r=rng(key+":meta");
    const av=sc.av||(r()>.75?"sparse":"full");
    return Object.assign({iso:sc.iso,name:geo?geo.name:sc.iso,m49:geo?geo.m49:0,lon:geo?geo.lon:0,lat:geo?geo.lat:0,region:geo?geo.region:"",
      pathogen:path,pathogenId:sc.p,streams:sc.st,availability:av,
      completeness:+(av==="none"?0:av==="sparse"?.42+r()*.2:.78+r()*.2).toFixed(2),
      delayWeeks:+(av==="sparse"?2.2+r()*2:.6+r()*1.2).toFixed(1),
      lastUpdate:fmtTs(Date.now()-Math.floor(r()*60)*36e5)},ev);
  });
  const LABEL={GREEN:"No unusual activity detected",YELLOW:"Signal detected — review",ORANGE:"Unusual activity — investigate",RED:"Elevated reporting — human assessment"};
  const mapValues={};
  countries.forEach(c=>{
    mapValues[c.iso]={state:c.availability==="none"?"GREEN":c.state,
      label:c.availability==="none"?"Insufficient data for baseline":LABEL[c.state],
      availability:c.availability==="none"?"none":undefined,
      metrics:[["Stream",c.pathogen.name],["Deviation (z)",c.availability==="none"?"—":c.z.toFixed(2)],
               ["Consecutive weeks",c.availability==="none"?"—":c.consecutive],
               ["Completeness",c.availability==="none"?L.noData:pct(c.completeness)]]};
  });
  const alerts = countries.filter(c=>c.state!=="GREEN"&&c.availability!=="none").sort((a,b)=>b.z-a.z).map(buildAlert);
  _surv={countries:countries,mapValues:mapValues,alerts:alerts,generatedAt:fmtTs()};
  return _surv;
}
function buildAlert(c,i){
  const r=rng(c.iso+":"+c.pathogenId+":alert"), primary=c.streams[0], wks=c.series.length;
  const concordant=c.streams.filter(()=>r()>.5);
  const firstIdx=Math.min(wks-1,Math.max(0,wks-Math.max(1,c.consecutive)));
  return {
    id:"BW-2026-"+(1041+i), state:c.state, iso:c.iso, country:c.name, region:c.region,
    pathogen:c.pathogen.name, pathogenId:c.pathogenId,
    what:c.pathogen.name+" "+(primary==="env"?"environmental indicator":primary==="lab"?"laboratory confirmations":"reported cases")+
         " exceeded the estimated seasonal baseline for "+c.consecutive+" consecutive week"+(c.consecutive===1?"":"s")+".",
    where:c.name+" — national aggregate (sub-national resolution not available in this synthetic stream)",
    when:"Detected on the week ending "+c.series[wks-1].date+"; first exceedance in the current window "+c.series[firstIdx].date,
    source:primary, sources:c.streams, observed:c.last.value, baseline:c.last.baseline,
    interval:[c.last.lo,c.last.hi], z:c.z,
    detector:"Seasonal baseline (52-week) + 2σ exceedance with 2-week persistence rule",
    model:"Statistical baseline only — no trained machine-learning model contributed to this signal",
    confidence:c.completeness>.8?"Moderate":"Low",
    uncertainty:"Baseline estimated from "+wks+" synthetic weeks; 95% interval "+c.last.lo+"–"+c.last.hi+". Reporting delay ≈ "+c.delayWeeks+" weeks means the most recent point is likely to revise upward.",
    concordance:concordant.length>1?"Deviation appears in "+concordant.length+" of "+c.streams.length+" configured streams":"Deviation appears in a single stream only — weak evidence",
    alternatives:(ALT_EXPL[primary]||ALT_EXPL.epi).slice(0,3),
    recommended:c.state==="RED"?"Escalate to a qualified epidemiologist for assessment within 24 h. Verify against the primary source before any external communication."
      :c.state==="ORANGE"?"Assign to an analyst for structured investigation. Check source data revisions and cross-stream concordance."
      :"Add to triage queue. Re-evaluate at the next data refresh before any action.",
    status:i===0?"Under review":"Awaiting triage",
    createdAt:fmtTs(Date.now()-(i+1)*54e5)
  };
}
function summarise(s){
  return {
    monitored:s.countries.length,
    withData:s.countries.filter(c=>c.availability!=="none").length,
    active:s.alerts.length,
    underReview:s.alerts.filter(a=>a.status==="Under review").length,
    awaiting:s.alerts.filter(a=>a.status==="Awaiting triage").length,
    byState:["RED","ORANGE","YELLOW","GREEN"].map(k=>({state:k,n:s.countries.filter(c=>c.state===k&&c.availability!=="none").length})),
    meanCompleteness:+(s.countries.reduce((a,c)=>a+c.completeness,0)/s.countries.length).toFixed(2),
    meanDelay:+(s.countries.reduce((a,c)=>a+c.delayWeeks,0)/s.countries.length).toFixed(1)
  };
}

  const W=780, f=chartFrame(W,o.h,{l:44,r:10,t:8,b:20});
  const vals=data.map(d=>d.value).concat(o.band?data.map(d=>d.hi):[]);
  const min=0, max=Math.max.apply(null,vals)*1.08||1;
  const fx=scaleLin(0,data.length-1,f.pad.l,f.w-f.pad.r), fy=scaleLin(min,max,f.h-f.pad.b,f.pad.t);
  const line=k=>data.map((d,i)=>(i?"L":"M")+fx(i).toFixed(1)+" "+fy(d[k]).toFixed(1)).join(" ");
  let band="";
  if(o.band){
    const up=data.map((d,i)=>(i?"L":"M")+fx(i).toFixed(1)+" "+fy(d.hi).toFixed(1)).join(" ");
    const dn=data.slice().reverse().map((d,i)=>"L"+fx(data.length-1-i).toFixed(1)+" "+fy(d.lo).toFixed(1)).join(" ");
    band='<path d="'+up+" "+dn+' Z" fill="var(--primary)" opacity=".10"/>';
  }
  const flagged=o.flags?data.map((d,i)=>d.flag?'<circle cx="'+fx(i).toFixed(1)+'" cy="'+fy(d.value).toFixed(1)+'" r="3" fill="var(--orange)"/><circle cx="'+fx(i).toFixed(1)+'" cy="'+fy(d.value).toFixed(1)+'" r="5.5" fill="none" stroke="var(--orange)" opacity=".5"/>':"").join(""):"";
  const step=Math.max(1,Math.floor(data.length/6));
  const xlabels=data.map((d,i)=>i%step===0?'<text x="'+fx(i).toFixed(1)+'" y="'+(f.h-6)+'" text-anchor="middle" fill="#3a5061" font-size="9">'+d.date.slice(2,7)+'</text>':"").join("");
  return '<svg class="chart" viewBox="0 0 '+W+' '+o.h+'" preserveAspectRatio="none" style="width:100%;height:'+o.h+'px">'+
    gridLines(f,ticksFor(min,max,4),fy)+band+
    (o.baseline?'<path d="'+line("baseline")+'" fill="none" stroke="#7f95a6" stroke-width="1.2" stroke-dasharray="4 3"/>':"")+
    '<path d="'+line("value")+'" fill="none" stroke="'+o.color+'" stroke-width="1.8"/>'+flagged+xlabels+
    (o.yLabel?'<text x="10" y="12" fill="#3a5061" font-size="9">'+o.yLabel+'</text>':"")+'</svg>';
}
function spark(data,color,h){

  const fx=scaleLin(0,vals.length-1,1,W-1), fy=scaleLin(min,max*1.05,h-2,2);

function barChart(data,opt){

function hBarChart(data,opt){

        '<text x="'+(fx(d.value)+6).toFixed(1)+'" y="'+(y+11)+'" fill="#62788a" font-size="9" font-family="var(--mono)">'+d.value+'</text>';}).join("")+'</svg>';

function stackedChart(data,keys,colors,h){
  h=h||190; const W=780, f=chartFrame(W,h,{l:44,r:8,t:8,b:20});
  const totals=data.map(d=>keys.reduce((a,k)=>a+d[k],0)), max=Math.max.apply(null,totals)*1.08||1;
  const fx=scaleLin(0,data.length-1,f.pad.l,f.w-f.pad.r), fy=scaleLin(0,max,f.h-f.pad.b,f.pad.t);
  let acc=data.map(()=>0), out="";
  keys.forEach((k,ki)=>{
    const top=data.map((d,i)=>{acc[i]+=d[k];return acc[i];});
    const upper=top.map((v,i)=>(i?"L":"M")+fx(i).toFixed(1)+" "+fy(v).toFixed(1)).join(" ");
    const lower=top.slice().reverse().map((v,i)=>{const idx=data.length-1-i;return "L"+fx(idx).toFixed(1)+" "+fy(top[idx]-data[idx][k]).toFixed(1);}).join(" ");
    out+='<path d="'+upper+" "+lower+' Z" fill="'+colors[ki]+'" opacity=".32" stroke="'+colors[ki]+'" stroke-width="1"/>';
  });
  const step=Math.max(1,Math.floor(data.length/6));
  return '<svg class="chart" viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+h+'px">'+
    gridLines(f,ticksFor(0,max,4),fy)+out+
    data.map((d,i)=>i%step===0?'<text x="'+fx(i).toFixed(1)+'" y="'+(h-5)+'" text-anchor="middle" fill="#3a5061" font-size="9">'+d.date.slice(2,7)+'</text>':"").join("")+'</svg>';
}
function contribChart(data,h){
  h=h||150; const W=620, padL=190, rowh=Math.min(30,(h-16)/data.length);
  const maxAbs=Math.max.apply(null,data.map(d=>Math.abs(d.contribution)))*1.15||1;
  const mid=padL+(W-padL-20)/2, half=(W-padL-20)/2, fx=v=>mid+(v/maxAbs)*half;
  return '<svg class="chart" viewBox="0 0 '+W+' '+(data.length*rowh+16)+'" style="width:100%;height:'+(data.length*rowh+16)+'px">'+
    '<line x1="'+mid+'" x2="'+mid+'" y1="4" y2="'+(data.length*rowh+8)+'" stroke="#3a5061"/>'+
    data.map((d,i)=>{const y=8+i*rowh, x=Math.min(mid,fx(d.contribution)), w=Math.abs(fx(d.contribution)-mid);
      return '<text x="'+(padL-10)+'" y="'+(y+rowh/2+3)+'" text-anchor="end" fill="#93a7b8" font-size="10">'+esc(d.feature)+'</text>'+
        '<rect x="'+x.toFixed(1)+'" y="'+(y+4)+'" width="'+w.toFixed(1)+'" height="'+(rowh-10)+'" rx="2" fill="'+(d.contribution>=0?"var(--orange)":"var(--data)")+'"/>'+
        '<text x="'+(d.contribution>=0?fx(d.contribution)+5:fx(d.contribution)-5)+'" y="'+(y+rowh/2+3)+'" text-anchor="'+(d.contribution>=0?"start":"end")+'" fill="#62788a" font-size="9" font-family="var(--mono)">'+d.contribution+'</text>';}).join("")+'</svg>';
}

/* ============================================================ [S10]
   WORLD MAP RENDERER
   Geometry is embedded in this file (simplified Natural Earth,
   public domain). Visual encoding is deliberately conservative:
     fill  = detector STATE, never disease burden
     hatch = insufficient data — never rendered as "low activity"
   A signal is never rendered as a confirmed outbreak.
   ============================================================ */
let WORLD=null;
function world(){
  if(WORLD) return WORLD;
  const raw=document.getElementById("worlddata").textContent.trim().split("\n");
  WORLD=raw.map(line=>{
    const p=line.split("|"), id=+p[0], name=p[1];
    const rings=p[2].split("~").map(r=>r.split(" ").map(pt=>{const c=pt.split(",");return [+c[0],+c[1]];}));
    return {id:id,name:name,rings:rings,iso:M49_ISO[id]||null};
  });
  return WORLD;
}
const STATE_FILL={GREEN:"#16323f",YELLOW:"rgba(215,178,60,.42)",ORANGE:"rgba(217,130,43,.5)",RED:"rgba(207,74,74,.55)",NODATA:"#121b23"};
function project(lon,lat,W,H){
  // Equirectangular with clipped latitude range — honest, simple, distortion documented.
  const x=(lon+180)/360*W, y=(78-Math.max(-58,Math.min(84,lat)))/(78+58)*H;
  return [x,y];
}
function worldMap(opt){
  const o=Object.assign({values:{},h:400,points:[],selected:null,focus:null,id:"map"+Math.random().toString(36).slice(2,7)},opt||{});
  const W=960, H=o.h;
  const paths=world().map(f=>{
    const v=f.iso?o.values[f.iso]:null;
    const fill=v?(v.availability==="none"?"url(#hatch)":(STATE_FILL[v.state]||STATE_FILL.NODATA)):STATE_FILL.NODATA;
    const sel=f.iso&&o.selected===f.iso;
    const d=f.rings.map(r=>r.map((pt,i)=>{const xy=project(pt[0],pt[1],W,H);return (i?"L":"M")+xy[0].toFixed(1)+" "+xy[1].toFixed(1);}).join(" ")+"Z").join(" ");
    let tip=esc(f.name);
    if(v){ tip+="\n"+esc(v.label||""); (v.metrics||[]).forEach(m=>{tip+="\n"+esc(m[0])+": "+esc(m[1]);}); tip+="\nSIMULATED — NOT REAL SURVEILLANCE"; }
    else tip+="\nNO STREAM CONFIGURED";
    return '<path class="land" d="'+d+'" fill="'+fill+'" stroke="'+(sel?"var(--primary-br)":"#1c2a34")+'" stroke-width="'+(sel?1.4:.4)+'"'+
      (f.iso&&v?' data-act="pickcountry" data-val="'+f.iso+'"':'')+'><title>'+tip+'</title></path>';
  }).join("");
  const pts=o.points.map(p=>{const xy=project(p.lon,p.lat,W,H);
    return '<g transform="translate('+xy[0].toFixed(1)+','+xy[1].toFixed(1)+')"'+(p.iso?' data-act="pickcountry" data-val="'+p.iso+'" style="cursor:pointer"':'')+'>'+
      '<circle r="'+((p.r||4)+3)+'" fill="none" stroke="'+p.color+'" stroke-width=".8" opacity=".45"/>'+
      '<circle r="'+(p.r||4)+'" fill="'+p.color+'" fill-opacity=".75" stroke="'+p.color+'" stroke-width=".7"><title>'+esc(p.label)+'</title></circle></g>';}).join("");
  const g = o.focus ? '<g transform="translate('+o.focus.tx+','+o.focus.ty+') scale('+o.focus.k+')">' : "<g>";
  return '<div class="maphold"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    '<defs><pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
    '<rect width="5" height="5" fill="#101a22"/><line x1="0" y1="0" x2="0" y2="5" stroke="#22323f" stroke-width="1.4"/></pattern></defs>'+
    '<rect width="'+W+'" height="'+H+'" fill="#08121a"/>'+g+paths+pts+'</g></svg></div>';
}
function mapLegend(compact){
  const items=[["GREEN","No unusual activity detected"],["YELLOW","Signal detected — review"],["ORANGE","Unusual activity — investigate"],["RED","Elevated reporting — human assessment"]];
  return '<div class="row" style="gap:14px">'+items.map(it=>'<span class="row" style="gap:6px"><span style="width:16px;height:10px;border-radius:2px;border:1px solid var(--line);background:'+STATE_FILL[it[0]]+'"></span><span class="xs mut">'+(compact?it[0]:it[1])+'</span></span>').join("")+
    '<span class="row" style="gap:6px"><svg width="16" height="10"><rect width="16" height="10" fill="#101a22" stroke="#22323f"/><line x1="0" y1="10" x2="16" y2="0" stroke="#22323f" stroke-width="1.4"/></svg><span class="xs dimc">Insufficient data — not "low activity"</span></span>'+
    '<span class="row" style="gap:6px"><span style="width:16px;height:10px;border-radius:2px;border:1px solid var(--line);background:'+STATE_FILL.NODATA+'"></span><span class="xs dimc">No stream configured</span></span></div>';

      ["Ranked feature contributions for the specific signal","Direction and magnitude of each contribution","The baseline value the deviation is measured against",
       "Uncertainty around the model output","A plausible biological or reporting-process interpretation","Alternative explanations that were not excluded",

        '<p style="margin:0">A feature attribution describes how a model used an input. It does not demonstrate that the input causes disease activity, and it does not validate the model. '+

  '<section class="lp-sec" id="limits"><div><div class="label mb2">Section 06</div><h2 class="h1 mb3">Research limitations</h2>'+

      '<span style="font-size:12.5px;color:var(--text)">'+l[0]+'</span></div><p class="small mut" style="margin:6px 0 0;line-height:1.7">'+l[1]+'</p></div>').join("")+'</div></div></section>'+

  '<section class="lp-sec" id="about"><div><div class="label mb2">Section 07</div><h2 class="h1 mb3">About the project</h2>'+
    '<div class="g gside"><div class="mut" style="font-size:13px;line-height:1.8">'+
      '<p>BIOWATCH-AI is a student-led research programme in computational biosurveillance. Its objective is methodological: to build a reproducible framework in which candidate detection methods can be compared fairly, and to report what that comparison actually shows.</p>'+
      '<p>The programme is stage-gated. This interface represents the <span style="color:var(--text)">possible end state</span> if the research objectives are met. It is deliberately built before the science so that the scientific requirements — labelling, baselines, human review, provenance — are structural rather than retrofitted.</p>'+
      '<p>Intended audiences: university researchers, biochemistry and bioinformatics students, epidemiologists, data scientists, public-health researchers, supervisors and scientific competition reviewers.</p>'+
      '<button class="btn out mt2" style="padding:9px 14px" data-act="go" data-val="app">Enter the prototype '+ico("arrow",14)+'</button></div>'+
      panel({title:"Not intended for",ev:"ESTABLISHED",body:'<ul class="clean cross">'+
        ["Clinical diagnosis or patient management","Operational outbreak declaration","Regulatory or policy decision-making","Border, travel or trade measures",
         "Any use implying validated performance","Any biosecurity-sensitive application"].map(x=>'<li>'+x+'</li>').join("")+'</ul>'})+
    '</div></div></section>'+

    '<p class="xs dimc" style="max-width:420px;line-height:1.7;margin:0">No real-world surveillance data, no validated model performance and no confirmed disease events are presented anywhere in this build. '+
    'Organisation names refer to publicly documented data sources only and imply no affiliation or endorsement.</p></div></footer></div>';
};

/* ---------------- ACCESS ---------------- */

];

      callout("warn","Prototype authentication","This screen does not authenticate anyone. It records a role locally in your browser so that role-based interface behaviour can be demonstrated. In a real deployment this would be institutional SSO (SAML/OIDC) with MFA, not a form.")+

      '<button class="btn pri wide" style="padding:10px" data-act="enter">'+ico("user",14)+' Enter prototype as '+ROLES.find(r=>r.id===role).name+'</button>'+
      '<p class="xs dimc mt2" style="line-height:1.6">By entering you acknowledge that all content is a research prototype, that alert states are interface states rather than public-health decisions, and that no figure shown constitutes validated performance.</p></div>'})+

/* ---------------- COMMAND CENTER ---------------- */
PAGES.app = function(){
  const Sv=surveillance(), sum=summarise(Sv);
  if(S.mode!=="DEMONSTRATION"){
    const live=S.mode==="LIVE";
    return pageHead({kicker:"Module 01",title:"Global Command Center",ev:"PLAN",desc:"Aggregated surveillance state across configured streams, regions and detectors."})+
      callout("info",live?"Live mode active":"Research mode active",
        live?'No data connector is currently configured, so this dashboard has nothing to display. Synthetic values are deliberately <b style="color:var(--text)">not</b> substituted in LIVE mode. Configure a source in <a data-act="go" data-val="connectors" href="#connectors">Data Connectors</a>, or switch to DEMONSTRATION mode to view the interface.'
             :'Research mode renders only datasets you have registered and experiments you have actually run. No dataset is registered in this session. Open the <a data-act="go" data-val="workspace" href="#workspace">Researcher Workspace</a>, or switch to DEMONSTRATION mode.')+
      '<div class="g g4 mt3">'+["Monitored regions","Signals detected","Signals under review","Data freshness"].map(l=>
        stat({label:l,value:"—",ev:"PLAN",sub:live?L.connNo:L.await_})).join("")+'</div>';
  }
  const streams={epi:synthSeries("global:epi",{level:4200,season:.35,disp:.12}),genomic:synthSeries("global:genomic",{level:860,season:.2,disp:.22,trend:.3}),
    env:synthSeries("global:env",{level:310,season:.4,disp:.25}),lab:synthSeries("global:lab",{level:1900,season:.3,disp:.15}),
    synd:synthSeries("global:synd",{level:7300,season:.5,disp:.1}),event:synthSeries("global:event",{level:46,season:.15,disp:.35})};
  const notes={epi:"Case notifications",synd:"ILI/ARI consultations",lab:"Confirmations",genomic:"Sequences submitted",env:"Wastewater samples",event:"Unverified reports"};
  const focusAlert=Sv.alerts[0], focusCountry=Sv.countries.find(c=>c.iso===focusAlert.iso);

  const streamCard=k=>{const s=streams[k],m=STREAMS[k],last=s[s.length-1],prev=s[s.length-2];
    const delta=((last.value-prev.value)/Math.max(1,prev.value))*100;
    return '<div class="panel"><div class="body" style="padding:10px">'+
      '<div class="spread"><span class="row" style="gap:8px;color:'+m.c+'">'+ico(m.ico,15)+'<span style="font-size:12px;color:var(--text)">'+m.label+'</span></span>'+tag("SIMULATED")+'</div>'+
      '<div class="spread mt2" style="align-items:flex-end"><div><div class="num" style="font-size:19px;font-weight:600">'+fmtN(last.value)+'</div><div class="label">weekly index</div></div>'+
      '<div class="right"><div class="num" style="font-size:12px;color:'+(delta>=0?"var(--orange)":"var(--green)")+'">'+(delta>=0?"+":"")+delta.toFixed(1)+'%</div><div class="label">vs prev wk</div></div></div>'+
      spark(s.slice(-26),m.c,28)+
      '<div class="spread" style="border-top:1px solid var(--line);padding-top:6px"><span class="xs dimc">'+notes[k]+'</span><span class="mono9" style="color:var(--green)">STREAM ACTIVE</span></div></div></div>';};

  return pageHead({kicker:"Module 01",title:"Global Command Center",ev:"SIMULATED",
      desc:"Cross-stream surveillance state for the configured monitoring set. Every figure on this screen is generated by the in-browser synthetic engine and describes no real country, pathogen or event.",
      right:'<div class="row mt1" style="justify-content:flex-end">'+pill(ico("bell",10)+" "+sum.active+" open signals","var(--orange)")+'</div>'})+
    banner()+
    '<div class="g g4 mt3">'+
      stat({label:"Monitored territories",value:sum.monitored,ev:"SIMULATED",sub:sum.withData+" with a usable baseline",hint:"A territory is monitored when at least one stream is mapped to it."})+
      stat({label:"Signals detected (open)",value:sum.active,ev:"SIMULATED",color:"var(--orange)",sub:sum.underReview+" under review · "+sum.awaiting+" awaiting triage",hint:"Detector output pending human adjudication. Not outbreaks."})+
      stat({label:"Mean data completeness",value:pct(sum.meanCompleteness),ev:"SIMULATED",sub:"Mean reporting delay ≈ "+sum.meanDelay+" wk",hint:"Completeness constrains what any detector can possibly see."})+
      stat({label:"Model contribution",value:"0",unit:"/ 0 trained",ev:"ESTABLISHED",color:"var(--muted)",sub:"All current signals are baseline-derived",hint:"No machine-learning model has been trained in this build, so none contributes to any signal."})+
    '</div>'+
    '<div class="g gside mt3">'+
      panel({title:"Global surveillance state",ev:"SIMULATED",sub:"Fill encodes detector state, not disease burden. Hatching marks insufficient data — it is never rendered as low activity.",
        actions:'<button class="btn" data-act="go" data-val="map">Full map '+ico("arrow",12)+'</button>',
        body:worldMap({values:Sv.mapValues,h:380})+'<div class="mt2">'+mapLegend()+'</div>'})+
      '<div class="col">'+
        panel({title:"Signal state distribution",ev:"SIMULATED",sub:"Territories by current detector state.",body:
          sum.byState.map(b=>{const st=ALERT_STATES[b.state];
            return '<div class="row" style="gap:10px;padding:5px 0">'+dot(st.c)+'<span class="mono10" style="width:54px;color:'+st.c+'">'+b.state+'</span>'+
              '<span style="flex:1">'+meter(null,null,b.n,Math.max(1,sum.withData),st.c)+'</span>'+
              '<span class="num" style="width:22px;text-align:right">'+b.n+'</span></div>';}).join("")+
          '<p class="xs dimc" style="border-top:1px solid var(--line);padding-top:8px;margin:6px 0 0;line-height:1.6">'+ALERT_DISCLAIMER+'</p>'})+
        panel({title:"System confidence indicators",ev:"ASSUMPTION",sub:"Confidence in the SYSTEM's ability to observe — not confidence that an event exists.",body:
          meter("Baseline coverage",sum.withData+"/"+sum.monitored+" streams",sum.withData,sum.monitored,"var(--primary)")+
          meter("Input completeness",pct(sum.meanCompleteness),sum.meanCompleteness*100,100,"var(--data)")+
          meter("Timeliness (inverse delay)",sum.meanDelay+" wk mean",Math.max(0,100-sum.meanDelay*22),100,"var(--yellow)")+
          meter("Cross-stream concordance","Partial",38,100,"var(--env)")+
          '<div class="spread" style="border-top:1px solid var(--line);padding-top:8px"><span class="small mut">Validated detection performance</span>'+
          '<span class="mono10 dimc">'+L.await_+'</span></div>'})+
      '</div></div>'+

    '<div class="spread mt3 mb2"><h2 class="h2">Surveillance streams</h2><span class="xs dimc">Weekly aggregate index per stream · synthetic</span></div>'+
    '<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">'+["epi","synd","lab","genomic","env","event"].map(streamCard).join("")+'</div>'+

    '<div class="g gside mt3">'+
      panel({title:"Highest-deviation stream — "+focusCountry.name+" · "+focusCountry.pathogen.name,ev:"SIMULATED",accent:ALERT_STATES[focusAlert.state].c,
        sub:"Observed weekly counts against the seasonal baseline with 95% interval. Flagged points exceeded 2σ.",
        actions:'<button class="btn" data-act="go" data-val="signals">Detection engine →</button>',
        body:signalChart(focusCountry.series.slice(-78),{h:210})+
          '<div class="g g4 mt2">'+[["Observed (latest wk)",fmtN(focusAlert.observed)],["Baseline expectation",fmtN(focusAlert.baseline)],
            ["Deviation","z = "+focusAlert.z],["Consecutive weeks",focusCountry.consecutive]]
            .map(x=>'<div class="item"><div class="label">'+x[0]+'</div><div class="num" style="font-size:13px;margin-top:2px">'+x[1]+'</div></div>').join("")+'</div>'+
          '<div class="mt2">'+callout("warn","Interpretation constraint","An exceedance of a synthetic baseline demonstrates that the detector fires. It does not indicate disease activity anywhere. "+L.causation)+'</div>'})+
      panel({title:"Recent signals",ev:"SIMULATED",sub:"Ordered by deviation magnitude. All require human adjudication.",
        actions:'<button class="btn" data-act="go" data-val="alerts">Alert center →</button>',
        body:Sv.alerts.slice(0,6).map(a=>'<div class="item" style="cursor:pointer" data-act="go" data-val="alerts">'+
          '<div class="row" style="gap:8px">'+dot(ALERT_STATES[a.state].c)+'<span class="num xs dimc">'+a.id+'</span>'+
          '<span class="mono9" style="color:'+ALERT_STATES[a.state].c+'">'+a.state+'</span><span class="xs dimc" style="margin-left:auto">'+a.status+'</span></div>'+
          '<div style="font-size:12px;margin-top:4px">'+a.country+' · '+a.pathogen+'</div>'+
          '<div class="xs mut" style="margin-top:2px;line-height:1.5">'+a.what+'</div></div>').join("")})+
    '</div>'+

    '<div class="g g3 mt3">'+
      panel({title:"Data-source health",ev:"ESTABLISHED",sub:"Connector configuration state in this build.",
        actions:'<button class="btn" data-act="go" data-val="connectors">Manage →</button>',
        body:'<div class="row mb2">'+stat({label:"Defined",value:CONNECTORS.length,ev:"ESTABLISHED"})+stat({label:"Configured",value:"0",ev:"ESTABLISHED",color:"var(--dim)"})+'</div>'+
          table([{h:"Source",r:r=>'<span class="small">'+esc(r.name)+'</span>'},{h:"Freq",r:r=>'<span class="num xs dimc">'+esc(r.freq)+'</span>'},
            {h:"State",align:"right",r:()=>'<span class="mono9 dimc">NOT CONFIGURED</span>'}],CONNECTORS.slice(0,6))+
          '<p class="xs dimc mt2" style="line-height:1.6">'+L.connReq+' — connectors are defined in the architecture but no live credentials or endpoints are active in this prototype.</p>'})+
      panel({title:"Model status",ev:"ESTABLISHED",sub:"Registry of models the research programme intends to evaluate.",
        actions:'<button class="btn" data-act="go" data-val="ml-lab">ML lab →</button>',
        body:table([{h:"Model",k:"m"},{h:"Role",k:"role"},{h:"Status",align:"right",r:r=>'<span class="mono9" style="color:'+r.c+'">'+r.s+'</span>'}],[
          {m:"Seasonal baseline (52-wk)",role:"Comparator",s:"IMPLEMENTED",c:"var(--green)"},
          {m:"EWMA control chart",role:"Comparator",s:"IMPLEMENTED",c:"var(--green)"},
          {m:"CUSUM",role:"Comparator",s:"IMPLEMENTED",c:"var(--green)"},
          {m:"Fixed threshold rule",role:"Comparator",s:"IMPLEMENTED",c:"var(--green)"},
          {m:"Farrington-type regression",role:"Comparator",s:"PLANNED",c:"var(--dim)"},
          {m:"Isolation Forest",role:"Candidate",s:"NOT TRAINED",c:"var(--yellow)"},
          {m:"Random Forest / GBM",role:"Candidate",s:"NOT TRAINED",c:"var(--yellow)"},
          {m:"Sequence model (LSTM/TCN)",role:"Later stage",s:"NOT STARTED",c:"var(--dim)"}])+
          '<div class="item mt2"><div class="label">Reported performance</div>'+awaiting(L.await_,"No model has been fitted; therefore no metric is displayable.")+'</div>'})+
      panel({title:"Emerging signals watchlist",ev:"SIMULATED",sub:"Streams trending upward but not yet exceeding the detection threshold.",
        body:table([{h:"Territory",k:"name"},{h:"Stream",r:r=>'<span class="small mut">'+r.pathogen.name+'</span>'},
          {h:"z",align:"right",r:r=>'<span class="num small">'+r.z.toFixed(2)+'</span>'},
          {h:"12-wk",align:"right",r:r=>'<div style="width:70px;margin-left:auto">'+spark(r.series.slice(-12),"var(--dim)",20)+'</div>'}],
          Sv.countries.filter(c=>c.state==="GREEN"&&c.availability!=="none").sort((a,b)=>b.z-a.z).slice(0,6))+
          '<p class="xs dimc mt2" style="line-height:1.6">Watchlist membership is a statistical property of a synthetic series. It carries no epidemiological meaning.</p>'})+
    '</div>'+

    '<div class="g g2 mt3">'+
      panel({title:"Regional activity index",ev:"SIMULATED",sub:"Mean absolute deviation across configured territories, by WHO-style region grouping.",
        body:hBarChart(["AFRO","EMRO","EURO","PAHO","SEARO","WPRO"].map(r=>{
          const cs=Sv.countries.filter(c=>c.region===r&&c.availability!=="none");
          const v=cs.length?+(cs.reduce((a,c)=>a+Math.abs(c.z),0)/cs.length).toFixed(2):0;
          return {name:r,value:v,color:v>1.6?"var(--orange)":v>.9?"var(--yellow)":"var(--primary)"};}))+
          '<p class="xs dimc" style="line-height:1.6">Regional aggregation hides sub-national heterogeneity and is dominated by whichever territories report most completely — a known bias, not a finding.</p>'})+
      panel({title:"Last data update & refresh policy",ev:"ESTABLISHED",body:
        [["Synthetic engine","Deterministic — regenerated identically on every load",fmtTs()],["Public connectors",L.connNo,"—"],
         ["Registered research datasets","None registered in this session","—"],["Model artefacts","None present","—"]]
        .map(x=>'<div class="spread" style="border-bottom:1px solid rgba(30,44,55,.6);padding-bottom:6px;margin-bottom:6px"><div><div style="font-size:12px">'+x[0]+'</div>'+
          '<div class="xs dimc">'+x[1]+'</div></div><span class="num xs dimc">'+x[2]+'</span></div>').join("")+
        '<div class="row mt2">'+pill(dot("var(--ev-simulated)")+"DEMO DATA","var(--ev-simulated)")+'<span class="num xs dimc">'+fmtTs()+' · in-browser synthetic engine</span></div>'})+
    '</div>';
};

/* ---------------- SURVEILLANCE MAP ---------------- */
PAGES.map = function(){
  const Sv=surveillance();
  const layer=S.ui.layer||"all", pth=S.ui.mpath||"all", selIso=S.ui.selIso||"NGA";
  const filtered=Sv.countries.filter(c=>(layer==="all"||c.streams.indexOf(layer)>=0)&&(pth==="all"||c.pathogenId===pth));
  const values={}; filtered.forEach(c=>values[c.iso]=Sv.mapValues[c.iso]);
  const points=filtered.filter(c=>c.availability!=="none").map(c=>({lon:c.lon,lat:c.lat,iso:c.iso,
    label:c.name+" · "+c.pathogen.name+" — "+Sv.mapValues[c.iso].label+" (SIMULATED)",color:ALERT_STATES[c.state].c,r:2.5+Math.min(5,Math.abs(c.z)*1.5)}));
  const sel=Sv.countries.find(c=>c.iso===selIso), selAlert=Sv.alerts.find(a=>a.iso===selIso);
  if(S.mode!=="DEMONSTRATION"){
    return pageHead({kicker:"Module 03",title:"Surveillance Map",ev:"PLAN",desc:"Geographic exploration of signal state by territory, stream and pathogen."})+
      callout("info","No geographic data available in this mode","Map geometry is available, but no configured stream supplies territory-level values in the active mode. Switch to DEMONSTRATION mode to explore the interface, or configure a connector.")+
      '<div class="mt3">'+worldMap({values:{},h:400})+'</div>';
  }
  return pageHead({kicker:"Module 03",title:"Surveillance Map",ev:"SIMULATED",
      desc:"Territory-level detector state for the synthetic monitoring set. Colour encodes what the detector reported, never a confirmed epidemiological situation."})+
    banner("SIMULATED DATA — NOT REAL-WORLD SURVEILLANCE. No country shown is experiencing the depicted activity.")+
    '<div class="g gside mt3">'+
      panel({title:"Global view",ev:"SIMULATED",sub:"Click a territory to inspect its stream detail.",
        actions:seg("mproj",S.ui.mproj||"world",[{v:"world",l:"World"},{v:"africa",l:"Africa focus"},{v:"asia",l:"Asia focus"}]),
        body:'<div class="row mb2"><span class="label">Stream layer</span>'+
          seg("layer",layer,[{v:"all",l:"All"},{v:"epi",l:"Epi",c:STREAMS.epi.c},{v:"genomic",l:"Genomic",c:STREAMS.genomic.c},{v:"env",l:"Env",c:STREAMS.env.c},{v:"lab",l:"Lab",c:STREAMS.lab.c},{v:"synd",l:"Synd",c:STREAMS.synd.c}])+
          '<span class="label" style="margin-left:8px">Pathogen</span><select data-act="mpath" style="width:170px"><option value="all">All streams</option>'+
          PATHOGENS.map(p=>'<option value="'+p.id+'"'+(pth===p.id?" selected":"")+'>'+esc(p.name)+'</option>').join("")+'</select></div>'+
          worldMap({values:values,points:points,h:420,selected:selIso,

PAGES.disease = function(){

  const pathogen=PATHOGENS.find(p=>p.id===pid);
  const countries=Sv.countries.filter(c=>c.pathogenId===pid);
  if(S.mode!=="DEMONSTRATION"){
    return pageHead({kicker:"Module 04",title:"Disease Intelligence",ev:"PLAN",desc:"Per-pathogen exploration of incidence, baseline deviation, seasonality, confirmation and reporting behaviour."})+
      callout("info","No pathogen stream bound in this mode","This module renders only what a configured connector or registered dataset supplies. Nothing is bound in the active mode, and synthetic values are not substituted. Reference metadata below is descriptive public-health knowledge and contains no counts.")+
      '<div class="g g2 mt3">'+PATHOGENS.slice(0,4).map(p=>panel({title:esc(p.name),ev:"ESTABLISHED",sub:p.cls+" · "+p.family,
        body:'<p class="small mut" style="margin:0;line-height:1.7">'+p.season+'</p><p class="xs dimc" style="margin:6px 0 0">'+p.surv+'</p>'})).join("")+'</div>';
  }
  const global=synthSeries("disease:"+pid,{weeks:156,level:400+pid.length*37,season:pid==="lassa"?.75:.5,disp:.18,
    injectAt:countries.some(c=>c.state!=="GREEN")?8:null,injectSize:.4});
  const view=global.slice(-win), latest=view[view.length-1];
  const delays=synthDelay(pid);
  const rs=rng(pid+":season");
  const seasonality=["J","F","M","A","M","J","J","A","S","O","N","D"].map((m,i)=>({name:m,
    value:+(50+40*Math.sin((i/12)*2*Math.PI-(pid==="lassa"?.2:1.6))+rs()*12).toFixed(1)}));
  const rc=rng(pid+":comp");
  const comp=global.slice(-52).map(p=>({date:p.date,suspected:Math.round(p.value*(.55+rc()*.1)),
    confirmed:Math.round(p.value*(.28+rc()*.08)),probable:Math.round(p.value*(.1+rc()*.05))}));
  const mapVals={}; countries.forEach(c=>mapVals[c.iso]=Sv.mapValues[c.iso]);

  return pageHead({kicker:"Module 04",title:"Disease Intelligence",ev:"SIMULATED",
      desc:"Pathogen-centred view combining synthetic activity series with descriptive surveillance metadata. Descriptive text is established public-health knowledge; every number is synthetic."})+
    banner()+
    '<div class="row mt3 mb3">'+PATHOGENS.map(p=>'<button class="btn'+(pid===p.id?" on":"")+'" data-act="pid" data-val="'+p.id+'">'+esc(p.name)+'</button>').join("")+'</div>'+
    '<div class="g gside">'+
      '<div class="col">'+
        '<div class="g g4">'+
          stat({label:"Latest weekly count",value:fmtN(latest.value),ev:"SIMULATED",sub:"Week ending "+latest.date})+
          stat({label:"Baseline expectation",value:fmtN(latest.baseline),ev:"SIMULATED",sub:"95% interval "+latest.lo+"–"+latest.hi})+
          stat({label:"Deviation from baseline",value:(latest.z>0?"+":"")+latest.z.toFixed(2)+"σ",ev:"SIMULATED",
            color:latest.z>=2?"var(--orange)":"var(--text)",sub:latest.z>=2?"Exceeds detection threshold":"Within baseline interval"})+
          stat({label:"Deaths reported",value:"—",ev:"SIMULATED",color:"var(--dim)",sub:"Mortality stream not generated",
            hint:"Mortality is deliberately not synthesised: fabricating death counts, even labelled, is unacceptable."})+
        '</div>'+
        panel({title:esc(pathogen.name)+" — incidence trend against baseline",ev:"SIMULATED",
          sub:"Solid: synthetic observed counts. Dashed: seasonal baseline. Band: 95% interval.",
          actions:seg("win",String(win),[{v:"52",l:"1 yr"},{v:"104",l:"2 yr"},{v:"156",l:"3 yr"}]),
          body:signalChart(view,{h:220,yLabel:"weekly count"})})+
        '<div class="g g2">'+
          panel({title:"Case classification composition",ev:"SIMULATED",sub:"Suspected / probable / laboratory-confirmed split — the confirmation ratio matters more than the total.",
            body:stackedChart(comp,["suspected","probable","confirmed"],["#4a90c4","#c9a227","#2ea89a"],180)+
              '<div class="row mt1">'+[["Suspected","#4a90c4"],["Probable","#c9a227"],["Confirmed","#2ea89a"]].map(x=>
              '<span class="row" style="gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:'+x[1]+'"></span><span class="xs mut">'+x[0]+'</span></span>').join("")+'</div>'})+
          panel({title:"Seasonality profile",ev:"SIMULATED",sub:"Descriptive note (ESTABLISHED): "+pathogen.season,
            body:barChart(seasonality,{h:180,color:"var(--env)"})+
              '<p class="xs dimc" style="line-height:1.6">A seasonal profile estimated from few years of data is unstable, and any detector built on it inherits that instability.</p>'})+
        '</div>'+
        '<div class="g g2">'+
          panel({title:"Reporting delay distribution",ev:"SIMULATED",sub:"Share of reports arriving n weeks after the event week. Drives now-cast correction.",
            body:barChart(delays.map(d=>({name:"+"+d.lag+"w",value:Math.round(d.share*100)})),{h:160,color:"var(--yellow)",unit:"%"})+
              callout("warn","Why this matters","The most recent points of any surveillance series are incomplete. A detector that ignores delay will read incompleteness as a decline, then read the back-fill as a surge.")})+
          panel({title:"Geographic distribution",ev:"SIMULATED",sub:"Territories with this stream configured in the synthetic set.",
            body:worldMap({values:mapVals,h:200,points:countries.filter(c=>c.availability!=="none").map(c=>({lon:c.lon,lat:c.lat,iso:c.iso,label:c.name+" (SIMULATED)",color:ALERT_STATES[c.state].c,r:3+Math.abs(c.z)}))})+
              '<div class="mt2">'+mapLegend(true)+'</div>'})+
        '</div>'+
      '</div>'+
      '<div class="col">'+
        panel({title:"Pathogen reference",ev:"ESTABLISHED",sub:"Descriptive metadata — contains no counts and no claims about current activity.",
          body:kv([["Name",pathogen.name,false],["Family",pathogen.family,false],["Class",pathogen.cls,false],["Seasonality",pathogen.season,false],
            ["Surveillance practice",pathogen.surv,false],["Note",pathogen.note,false]])})+
        panel({title:"Stream availability",ev:"SIMULATED",body:Object.keys(STREAMS).map(k=>{const st=STREAMS[k],on=pathogen.streams.indexOf(k)>=0;
          return '<div class="listrow"><span style="color:'+(on?st.c:"var(--dim)")+'">'+ico(st.ico,13)+'</span><span class="small" style="flex:1;color:'+(on?"var(--text)":"var(--dim)")+'">'+st.label+'</span>'+
            '<span class="mono9" style="color:'+(on?st.c:"var(--dim)")+'">'+(on?"DESIGNED":"N/A")+'</span></div>';}).join("")})+
        panel({title:"Laboratory confirmation",ev:"SIMULATED",body:meter("Confirmation ratio (synthetic)","≈ 31%",31,100,"var(--primary)")+
          '<div class="listrow"><span class="small mut" style="flex:1">Assay</span><span class="num xs dimc">RT-PCR (reference)</span></div>'+
          '<div class="listrow"><span class="small mut" style="flex:1">Turnaround (synthetic)</span><span class="num xs dimc">2.4 d median</span></div>'+
          '<div class="listrow"><span class="small mut" style="flex:1">Validated sensitivity</span><span class="mono9 dimc">'+L.await_+'</span></div>'})+
        panel({title:"Relevant alerts",ev:"SIMULATED",body:(Sv.alerts.filter(a=>a.pathogenId===pid).length?
          Sv.alerts.filter(a=>a.pathogenId===pid).map(a=>'<div class="item"><div class="row" style="gap:8px">'+dot(ALERT_STATES[a.state].c)+
            '<span class="num xs dimc">'+a.id+'</span><span class="xs dimc" style="margin-left:auto">'+a.country+'</span></div>'+
            '<p class="xs mut" style="margin:4px 0 0;line-height:1.5">'+a.what+'</p></div>').join("")
          :'<div class="center small dimc" style="padding:16px 0">No open signal for this stream.</div>')})+
        panel({title:"Source connectors for this pathogen",ev:"ESTABLISHED",body:
          CONNECTORS.filter(c=>pathogen.streams.indexOf(c.stream)>=0).slice(0,5).map(c=>'<div class="item"><div class="small">'+esc(c.name)+'</div>'+
            '<div class="spread"><span class="xs dimc">'+esc(c.freq)+'</span><span class="mono9 dimc">'+(c.status==="available"?"CONFIG REQUIRED":c.status.toUpperCase())+'</span></div></div>').join("")})+
      '</div></div>'+
    '<div class="g g2 mt3">'+
      panel({title:"Territory breakdown",ev:"SIMULATED",body:table([{h:"Territory",k:"name"},
        {h:"Detector state",r:r=>'<span class="row" style="gap:6px;color:'+ALERT_STATES[r.state].c+'">'+dot(ALERT_STATES[r.state].c)+'<span class="small">'+(r.availability==="none"?"Insufficient data":r.state)+'</span></span>'},
        {h:"z",align:"right",r:r=>'<span class="num small">'+(r.availability==="none"?"—":r.z.toFixed(2))+'</span>'},
        {h:"26-wk",align:"right",r:r=>'<div style="width:80px;margin-left:auto">'+spark(r.series.slice(-26),"var(--dim)",20)+'</div>'}],
        countries,"No territory configured for this pathogen in the synthetic set.")})+
      panel({title:"What this module cannot tell you",ev:"ESTABLISHED",body:
        det("Incidence vs. detected incidence","Every series here is a series of <i>reports</i>. The relationship between reports and true incidence depends on care-seeking, testing access, case definition and administrative capacity — each of which varies over time and place.","ESTABLISHED")+
        det("Why no case-fatality figure is shown","A synthetic CFR would be a fabricated clinical statistic. Mortality streams are therefore left empty in DEMONSTRATION mode and populated only from a real, cited source.","ESTABLISHED")+
        det("Why deviation is not risk","A z-score measures distance from a statistical expectation. Converting it into a risk statement requires an epidemiological model of consequence, transmission and susceptibility that this prototype does not contain.","ESTABLISHED")+
        det("Planned additions",'<ul class="clean">'+["Now-casting with delay-adjusted reporting triangles","Rt estimation with documented serial-interval assumptions",
          "Age/sex stratification where the source provides it","Sub-national resolution where licensing permits"].map(x=>'<li>'+x+'</li>').join("")+'</ul>',"PLAN")})+
    '</div>';
};

PAGES.signals = function(){
  const Sv=surveillance();
  const stage=S.ui.stage||"detect", iso=S.ui.sigIso||"NGA", k=+(S.ui.k||2);
  const active=S.ui.dets||["seasonal","ewma","cusum","mad"];
  const country=Sv.countries.find(c=>c.iso===iso)||Sv.countries[0];
  const results=DETECTORS.filter(d=>d.impl&&active.indexOf(d.id)>=0).map(d=>d.run(country.series,{k:k}));
  const flagIdx={}; results.forEach(r=>r.flags.forEach((f,i)=>{if(f.flag)flagIdx[i]=1;}));
  const overlay=country.series.map((p,i)=>Object.assign({},p,{flag:flagIdx[i]?p.value:undefined}));
  const agree=results.length>1?detectorAgreement(results):null;
  const si=STAGES.find(s=>s.id===stage);

  return pageHead({kicker:"Module 05",title:"Signal Detection Engine",ev:"PRELIMINARY",
      desc:"The computational pipeline from raw record to reviewed candidate signal. Statistical detectors below execute live in the browser on the selected series; machine-learning stages are explicitly inert."})+
    (S.mode==="DEMONSTRATION"?banner("SIMULATED DATA — detectors are real code, the series they run on is synthetic."):"")+
    '<div class="mt3">'+panel({title:"Processing pipeline",ev:"PLAN",sub:"Select a stage to inspect its contract, implementation state and outputs.",
      body:'<div class="pipe">'+STAGES.map((s,i)=>'<button class="stage'+(stage===s.id?" on":"")+'" data-act="stage" data-val="'+s.id+'">'+

        '<div class="g g3">'+[["Contract",si.what],["Implementation state",si.impl],["Outputs",si.out]].map(x=>
          '<div><div class="label" style="margin-bottom:4px">'+x[0]+'</div><p class="small mut" style="margin:0;line-height:1.7">'+x[1]+'</p></div>').join("")+'</div>'+
        (si.st==="none"?'<div class="mt2">'+notImpl("Machine-learning scoring stage","This stage is deliberately inert. Enabling it requires a fixed label definition, a temporal split protocol, and a completed baseline comparison — in that order.")+'</div>':"")+'</div>'})+'</div>'+

    '<div class="g gside mt3">'+
      '<div class="col">'+
        panel({title:"Detector bench",ev:"PRELIMINARY",sub:"Detectors run live on the selected series. Output is a flag, not a finding.",
          actions:'<select data-act="sigIso" style="width:190px">'+Sv.countries.filter(c=>c.availability!=="none").map(c=>
            '<option value="'+c.iso+'"'+(iso===c.iso?" selected":"")+'>'+esc(c.name)+' · '+esc(c.pathogen.name)+'</option>').join("")+'</select>'+
            seg("k",String(k),[{v:"1.5",l:"k=1.5"},{v:"2",l:"k=2"},{v:"2.5",l:"k=2.5"},{v:"3",l:"k=3"}]),
          body:signalChart(overlay.slice(-104),{h:220})+
            '<div class="row mt2">'+DETECTORS.filter(d=>d.impl).map(d=>'<button class="btn'+(active.indexOf(d.id)>=0?" on":"")+'" data-act="toggledet" data-val="'+d.id+'">'+
              (active.indexOf(d.id)>=0?"✓ ":"")+d.label+'</button>').join("")+'</div>'})+
        panel({title:"Detector output comparison",ev:"PRELIMINARY",
          sub:"Flag counts and latest scores on the identical series. These are descriptive counts, NOT performance metrics — no reference labels exist.",
          body:table([{h:"Detector",r:r=>'<span class="small">'+esc(r.name)+'</span>'},

            '<div class="mt2">'+callout("warn","Why no performance figures appear here","Sensitivity, specificity, PPV and detection delay all require a reference set of true events. This prototype has none, and a synthetic injected step is not a real event. Reporting a metric against a step this code itself inserted would be circular.")+'</div>'})+

      '</div>'+

PAGES.xai = function(){
  const Sv=surveillance(), id=S.ui.xaiId||Sv.alerts[0].id;
  const alert=Sv.alerts.find(a=>a.id===id)||Sv.alerts[0];
  const c=Sv.countries.find(x=>x.iso===alert.iso), s=c.series;
  const last=s[s.length-1], prev=s[s.length-2], yearAgo=s[s.length-53]||s[0];
  const decomposition=[
    {feature:"Observed − baseline (residual)",contribution:+(last.value-last.baseline).toFixed(1)},
    {feature:"Week-over-week change",contribution:+(last.value-prev.value).toFixed(1)},
    {feature:"Seasonal expectation shift (52 wk)",contribution:+(last.baseline-yearAgo.baseline).toFixed(1)},
    {feature:"Baseline uncertainty half-width",contribution:+(-((last.hi-last.lo)/2)).toFixed(1)}];
  const interp={
    lassa:"Lassa fever activity in West Africa follows a pronounced dry-season pattern driven by rodent-reservoir ecology and human exposure. A dry-season rise is therefore expected and is not, in itself, unusual — which is precisely why the baseline must be seasonal rather than flat.",
    dengue:"Dengue transmission depends on vector abundance, itself driven by rainfall and temperature. A deviation coinciding with a rainfall anomaly has an environmental explanation available before any epidemiological one is required.",
    "influenza-a":"Influenza activity in temperate settings is strongly seasonal and its timing shifts year to year. Deviation from a fixed calendar expectation frequently reflects a shifted season rather than an unusual one.",
    "sars-cov-2":"Wastewater indicators can move ahead of case reporting because they do not depend on care-seeking. They are also sensitive to dilution, assay change and site substitution.",
    cholera:"Cholera reporting responds to water and sanitation conditions and to flooding. Rises frequently follow documented environmental events and mass-displacement contexts.",
    measles:"Measles resurgence is governed by accumulated susceptibility. A rise usually reflects an immunity gap that existed long before the signal appeared."};
  const contract=[["Important features","partial"],["Feature contribution & direction","partial"],["SHAP-style visualisation","missing"],["Trend contribution","partial"],
    ["Biological interpretation","present"],["Uncertainty statement","present"],["Alternative explanations","present"],["Model limitations","present"],["Data-quality caveats","present"]];
  const total=Math.max(1,last.value);
  const parts=[["Underlying level",Math.round(last.baseline*.72),"var(--primary)"],["Seasonal component",Math.round(last.baseline*.28),"var(--env)"],
    ["Unexplained residual",Math.max(0,last.value-last.baseline),"var(--orange)"]];

  return pageHead({kicker:"Module 09",title:"Explainable AI",ev:"PRELIMINARY",
      desc:"Explanation contract for every signal the platform emits. Model attributions require a trained model; none exists, so only the exact arithmetic decomposition of the statistical baseline is shown."})+
    callout("warn","Standing interpretive warning",'<p style="margin:0 0 6px;color:var(--text)"><b>'+L.causation+'</b></p>'+
      '<p style="margin:0">A contribution value describes how a computation used an input. It does not show that the input caused disease activity, it does not validate the computation, and attribution methods themselves are approximations with documented instability under correlated features.</p>')+
    '<div class="row mt3 mb3"><span class="label">Explain signal</span>'+
      seg("xaiId",id,Sv.alerts.slice(0,6).map(a=>({v:a.id,l:a.id.slice(-4)+" "+a.iso})))+'</div>'+
    '<div class="g gside">'+
      '<div class="col">'+
        panel({title:"Signal "+alert.id+" — "+alert.country+" · "+alert.pathogen,ev:"SIMULATED",sub:"Series context for the explanation below.",
          body:signalChart(s.slice(-78),{h:180})})+
        panel({title:"Deviation decomposition",ev:"PRELIMINARY",
          sub:"Exact arithmetic components of the observed deviation. This is algebra on the synthetic series, not a learned attribution.",
          body:contribChart(decomposition,170)+
            ['Reporting-delay adjustment','Cross-stream concordance term'].map(t=>'<div class="item row" style="border-style:dashed;justify-content:space-between"><span class="small dimc">'+t+'</span>'+
              '<span class="mono9 dimc">TERM UNAVAILABLE — INPUT NOT CONFIGURED</span></div>').join("")+
            '<div class="mt2">'+callout("info","What this is and is not","Positive bars raise the observed value above expectation; negative bars are the tolerance the baseline allows. Because the components are additive arithmetic, they sum exactly — unlike a learned attribution, which only approximates the model's behaviour locally.")+'</div>'})+
        panel({title:"Model attribution (SHAP-style)",ev:"PLAN",sub:"Reserved for a fitted model. Layout shown; values intentionally absent.",
          body:notImpl("Feature attribution for a trained model","Once a model is fitted, this panel will render per-signal SHAP values with a global summary (beeswarm), a local waterfall for the selected signal, and a stability check across bootstrap refits. Attribution will be withheld whenever the model's own validation performance is not established.")+
            '<div class="mt2">'+["Global feature importance (beeswarm)","Local waterfall for this signal","Dependence plots for top features","Attribution stability across refits","Counterfactual: minimum change that removes the signal"]
              .map(x=>'<div class="item spread"><span class="small mut">'+x+'</span><span class="mono9 dimc">'+L.await_+'</span></div>').join("")+'</div>'})+
        panel({title:"Trend contribution over time",ev:"PRELIMINARY",sub:"How much of the current level is level, seasonality and residual — decomposed on the synthetic series.",
          body:parts.map(p=>meter(p[0],p[1]+" ("+Math.round((p[1]/total)*100)+"%)",p[1],total,p[2])).join("")+
            '<p class="xs dimc" style="line-height:1.6">The "unexplained residual" is unexplained by the baseline model only. Reporting artefacts, testing changes and co-circulating pathogens all live inside this term.</p>'})+
      '</div>'+
      '<div class="col">'+
        panel({title:"Explanation contract",ev:"ESTABLISHED",sub:"Mandatory fields. A signal without all of them may not be shown to a reviewer.",
          body:contract.map(x=>'<div class="listrow"><span style="color:'+(x[1]==="present"?"var(--green)":x[1]==="partial"?"var(--yellow)":"var(--dim)")+'">'+
            ico(x[1]==="present"?"check":x[1]==="partial"?"info":"x",13)+'</span><span class="small mut" style="flex:1">'+x[0]+'</span>'+
            '<span class="mono9 dimc">'+x[1].toUpperCase()+'</span></div>').join("")})+
        panel({title:"Biological interpretation",ev:"ESTABLISHED",sub:"Textbook context for the pathogen — not an interpretation of the synthetic signal.",
          body:'<p class="small mut" style="margin:0;line-height:1.7">'+(interp[alert.pathogenId]||"No established interpretive note is registered for this pathogen.")+'</p>'+
            '<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px"><div class="label">Applies to this signal?</div>'+
            '<p class="xs dimc" style="margin:2px 0 0">Not determinable. The series is synthetic, so no biological process generated it.</p></div>'})+
        panel({title:"Uncertainty",ev:"PRELIMINARY",body:kv([["Baseline interval",alert.interval[0]+" – "+alert.interval[1]],["Deviation","z = "+alert.z],
          ["History used",s.length+" weeks (synthetic)"],["Model uncertainty","Not quantified — no model fitted",false],
          ["Label uncertainty","Not quantified — no reference labels",false],["Data completeness",pct(c.completeness)]])})+
        panel({title:"Limitations of this explanation",ev:"ESTABLISHED",body:'<ul class="clean">'+
          ["The decomposition explains the detector, not the disease process.",
           "Correlated inputs make any attribution non-unique; different valid methods will disagree.",
           "A plausible narrative attached to a statistical deviation is the single most common way surveillance systems mislead their users.",
           "The synthetic generator has no biology in it, so no explanation here can be biologically true."].map(x=>'<li>'+x+'</li>').join("")+'</ul>'})+
        panel({title:"Alternative explanations for this signal",ev:"SIMULATED",
          body:alert.alternatives.map(a=>'<div class="item small mut">'+a+'</div>').join("")+
            '<button class="btn out wide mt2" data-act="go" data-val="alerts">'+ico("bell",12)+' Open in Early-Warning Center</button>'})+
      '</div></div>';
};

PAGES["ml-lab"] = function(){
  const Sv=surveillance();
  const ds=S.ui.mlds||"synthetic", target=S.ui.mltarget||"exceed2sd", cv=S.ui.mlcv||"rolling";
  const feats=S.ui.mlfeats||["lag1","lag4","roll4","wow","resid"];

  const tr=+(S.ui.mltrain||60);

  const series=Sv.countries[0].series, n=series.length;
  const trainEnd=Math.floor(n*tr/100), valEnd=Math.floor(n*(tr+va)/100);
  const highRisk=feats.filter(f=>{const x=FEATURES.find(y=>y.id===f);return x&&x.risk==="high";});
  const hasBaseline=models.some(m=>["seasonal","ewma","farrington"].indexOf(m)>=0);
  const ack=!!S.ui.mlack;
  const canQueue=hasBaseline&&feats.length>=2&&ack&&cv!=="kfold";
  const spec={experiment_id:"EXP-"+new Date().toISOString().slice(0,10).replace(/-/g,"")+"-001",dataset:ds,target:target,
    split:tr+"/"+va+"/"+te+" temporal",validation:cv,features:feats,models:models,baseline_first:hasBaseline,
    created:fmtTs(),status:"SPECIFICATION ONLY — NOT EXECUTED"};
  S.ui._spec=spec;

  return pageHead({kicker:"Module 06",title:"Machine-Learning Laboratory",ev:"PLAN",
      desc:"Experiment configurator enforcing baseline-first development and correct temporal splitting. This build produces a reproducible run specification; it does not train models."})+
    callout("warn","No training occurs in this prototype","Model fitting requires a backend with the dataset registered and a fixed label definition. This interface therefore emits a specification that a researcher can execute offline. Any figure that would require a fitted model reads <span class=\"num\">"+L.await_+"</span>.")+
    '<div class="g gside mt3">'+
      '<div class="col">'+
